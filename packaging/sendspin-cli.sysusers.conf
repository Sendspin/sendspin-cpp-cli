# The account sendspin-cli.service runs as, installed to <prefix>/lib/sysusers.d.
#
# A declaration rather than a README line of `useradd`, because the two lines below are owed
# *together*: an account with no membership of `audio` is a player that starts and cannot open
# /dev/snd, which is root:audio mode 0660. As one file both halves arrive or neither does, and
# `systemd-sysusers` is idempotent, so the recipe survives being run twice.
#
# A tarball has no postinst, so nothing runs this for you -- README.md says to invoke
# `systemd-sysusers` once after installing. systemd-sysusers.service does run it at boot, but
# only when its ConditionNeedsUpdate=|/etc fires, so it is not what the install should rest on.
# Without the account the unit does not start at all: `systemctl status` reports 217/USER.
#
# The uid, home and shell are left as `-` on purpose. A fixed uid needs a registry nobody here
# keeps, and a spelled-out /usr/sbin/nologin is wrong on the distributions that ship
# /sbin/nologin instead -- systemd picks a free system uid and the host's own nologin.
#
# `m` creates the audio group if the host has none, which is the harmless end of it: a host with
# no sound card has no /dev/snd for the membership to reach either way.
u sendspin-cli - "Sendspin audio player" - -
m sendspin-cli audio
