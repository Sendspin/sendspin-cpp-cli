name: CI

# Unfiltered `push` as well as `pull_request` on purpose. The artifacts the build produces exist
# so a change can be tried on a Pi or a Mac without building it there, and that only works if
# every branch push produces them -- not just the ones that have a pull request open. The cost
# is that a PR raised from a branch in this repo builds twice.
#
# Except tags, which belong to release.yml. Both workflows call the same build, and the
# `concurrency` group below is keyed by workflow name, so nothing would collapse the pair: a
# `v*` push would otherwise run the matrix twice over and report two statuses for one tag.
# `tags-ignore` rather than a positive `branches` filter, so the sentence above stays "every
# branch push, except --" instead of a list a reader has to check is exhaustive.
on:
  push:
    tags-ignore:
      - '**'
  pull_request:

# A superseded push has nothing left to say. This does not collapse the push/PR pair above:
# those carry different refs, and so land in different groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Named rather than left to default, because the default is `bash -e` with no pipefail.
    # build.yml restates this for itself, a called workflow inheriting none of it.
    shell: bash

jobs:
  # A gate rather than a claim: scripts/smoke_test.sh is asserted to be shellcheck-clean, and
  # an assertion nothing enforces is one that stops being true. shellcheck ships on the Ubuntu
  # images, so this costs a runner-minute.
  #
  # Stays here rather than moving into build.yml with the rest: it lints scripts/, and no script
  # is in the install payload -- so it has nothing to say about what a release ships, while
  # smoke_test.sh is *run* by every publishing leg of the build in any case.
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Lint the shell scripts
        run: shellcheck scripts/*.sh

  # The matrix itself lives in build.yml, which release.yml calls too, so a change to how this
  # project builds reaches both paths rather than one of them.
  build:
    uses: ./.github/workflows/build.yml
