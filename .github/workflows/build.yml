name: Build

# The one definition of how this project builds, called by `ci.yml` on a push or a pull request
# and by `release.yml` on a tag. It is a reusable workflow rather than a composite action
# because what must not be duplicated is the *matrix* below, not the steps: a composite action
# cannot own `strategy.matrix`, so a second caller would have to restate the very block whose
# per-leg `publish`/`avahi` keys the comment there warns about getting wrong.
#
# No inputs, deliberately. A release is gated on exactly what a push is gated on -- the no-mDNS
# leg included, since a break in src/mdns_null.cpp is a real break -- and an input is the seam
# along which the two would start to differ.
on:
  workflow_call:

# Restated here rather than inherited: a called workflow gets none of the caller's
# workflow-level `permissions`, `defaults` or `env`. The one that matters is the shell. The
# default is `bash -e` with no pipefail, which would let the `| tee` in the configure step
# below swallow a configure failure -- leaving the assertion after it grepping a truncated log
# and both callers green on a build that never configured.
permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Both hosted runner sizes used here have at least three cores.
  CMAKE_BUILD_PARALLEL_LEVEL: 3

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # Well clear of a cold cache on the slowest leg -- which is linux-armv6, the one that
    # emulates every compile in the FetchContent tree where the others compile at native speed
    # -- and far under the six-hour default: the point is that a player which ignores SIGTERM
    # fails rather than holds a runner all day.
    timeout-minutes: 30
    strategy:
      # Every leg's result is wanted rather than only the first failure's: a break that shows
      # on one architecture and not another is precisely what the matrix is here to tell apart.
      fail-fast: false
      # `publish`, `avahi` and `systemd` are spelled out on every leg, false included: an `if:`
      # reads a missing key as false, so a leg that simply omitted one would quietly stop
      # publishing, or stop proving the unit it installs, and still go green. `with_pulse`,
      # `with_pipewire` and `werror` are spelled out for the sibling reason: an omitted key
      # reaches cmake as `-DSENDSPIN_CLI_WITH_PULSE=`, which is falsy, so a leg meaning to
      # build the backend -- or meaning to hold the warning line -- would silently not.
      #
      # `arm32` names the 32-bit ARM architecture a leg targets, and `container` says a leg
      # builds inside one rather than on the runner: what and how, and both empty on every leg
      # that builds for the runner it is on. `container` earns its place by the same test as
      # the rest and more sharply than any of them -- omit it on the ARMv6 leg and the build
      # happens on the Ubuntu host, against the ARMv7 `libgcc` and `crt1.o` that
      # scripts/build_arm32.sh refuses by name, and publishes an archive that traps on an
      # ARM1176.
      #
      # A new leg owes all nine, `with_mdns` included -- it has the same failure mode as its
      # two siblings -- and a `publish: true` leg owes a tenth thing in another file: an entry
      # in each of the two asset sets release.yml diffs before it publishes, which otherwise
      # fails the release with a diff rather than a reason. A publishing
      # *macOS* leg owes two entries in each, its tarball and the installer .pkg built further
      # down.
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            arm32: ''
            container: ''
            werror: 'ON'
            with_mdns: 'ON'
            with_pulse: 'ON'
            with_pipewire: 'ON'
            expect_probe: 'Failed'
            expect_backends: '^-- sendspin-cli audio backends: null, stdout, alsa, portaudio, pulse, pipewire$'
            expect_mdns: '^-- sendspin-cli mDNS: dns_sd \(.*libdns_sd\.so.*\)$'
            runtime_packages: 'libasound2t64 libportaudio2 libpulse0 libpipewire-0.3-0 libavahi-compat-libdnssd1'
            publish: true
            avahi: true
            systemd: true

          - name: linux-arm64
            runner: ubuntu-24.04-arm
            arm32: ''
            container: ''
            werror: 'ON'
            with_mdns: 'ON'
            with_pulse: 'ON'
            with_pipewire: 'ON'
            expect_probe: 'Failed'
            expect_backends: '^-- sendspin-cli audio backends: null, stdout, alsa, portaudio, pulse, pipewire$'
            expect_mdns: '^-- sendspin-cli mDNS: dns_sd \(.*libdns_sd\.so.*\)$'
            runtime_packages: 'libasound2t64 libportaudio2 libpulse0 libpipewire-0.3-0 libavahi-compat-libdnssd1'
            publish: true
            avahi: false
            systemd: true

          # The 32-bit Raspberry Pi leg, cross-compiled because no runner can build it natively:
          # GitHub offers no armv7 image, and its arm64 images are Neoverse N1, which has no
          # AArch32 at EL0 -- so there is no `runs-on` value that reaches this target. Emulating
          # the whole build is the other route, and it would pay for every compile in the
          # FetchContent tree to arrive somewhere this already is: compiling at native speed and
          # emulating only what has to be executed puts configure, build and suite inside a
          # minute of runner time.
          #
          # That trade is available here and nowhere else in this matrix. The ARMv6 leg below
          # has no cross toolchain to take the other side of it, which is what its own comment
          # is about -- so it pays the emulation this leg declines.
          #
          # `expect_mdns` is anchored on the multiarch library path rather than left as the
          # `.*libdns_sd\.so.*` the native legs use, and that is the leg's own cross-check: a
          # find_library that answered with the runner's x86_64 copy would configure cleanly,
          # report mDNS as found, link nothing usable, and satisfy the looser pattern.
          #
          # `runtime_packages` names Raspberry Pi OS trixie's spellings, not this runner's.
          # Debian renamed both of the ones that moved in its 64-bit time_t transition, so
          # `libasound2` and `libpipewire-0.3-0` are bookworm's names and wrong for what ships
          # today -- and this string is copied verbatim into the BUILD-INFO.txt inside the
          # archive, so it is read by someone on the target rather than by someone here.
          - name: linux-armv7
            runner: ubuntu-24.04
            arm32: 'armv7'
            container: ''
            werror: 'ON'
            with_mdns: 'ON'
            with_pulse: 'ON'
            with_pipewire: 'ON'
            expect_probe: 'Failed'
            expect_backends: '^-- sendspin-cli audio backends: null, stdout, alsa, portaudio, pulse, pipewire$'
            expect_mdns: '^-- sendspin-cli mDNS: dns_sd \(/usr/lib/arm-linux-gnueabihf/libdns_sd\.so\)$'
            runtime_packages: 'libasound2t64 libportaudio2 libpulse0 libpipewire-0.3-0t64 libavahi-compat-libdnssd1'
            publish: true
            avahi: false
            systemd: false

          # The ARMv6 Raspberry Pi leg -- a Pi Zero, a Pi Zero W, an original Pi -- and the one
          # leg here that is not built the way its neighbour above is. The cross route is not
          # slower for this target, it is unavailable: Debian and Ubuntu armhf are an ARMv7-A
          # port, so a cross toolchain's own crt1.o, crtbegin.o and every member of libgcc.a
          # are ARMv7 and are linked into the binary whatever `-march` said. Raspbian's really
          # are ARMv6 and Raspbian publishes no cross toolchain, so the only way to an ARMv6
          # archive is an ordinary native build run inside an emulated Raspbian container.
          # scripts/build_armv6_container.sh owns it, for the reason build_arm32.sh is a script.
          #
          # Started by hand rather than named in a job-level `container:`, which the
          # `pipewire-minimum` job below really does use -- and the difference is ordering, not
          # taste. That key creates the container before the first step runs, and the emulator
          # has to be registered on the *host* before an ARM container can execute anything at
          # all; there would be nowhere left to put docker/setup-qemu-action. Its steps would
          # also run as root, which the non-root note further down is about.
          #
          # balenalib's rather than an official Raspberry Pi image, because there is no official
          # one: Raspberry Pi publishes OS images, not container images. What matters is that
          # this one installs from archive.raspbian.org -- the ARMv6 port -- rather than from
          # Debian's ARMv7-A armhf, and its gcc is configured `--with-arch=armv6
          # --with-float=hard`, which is why nothing on this leg passes `-march` at all. Pinned
          # by digest for the reason every action in this file is pinned to a commit, and
          # bookworm rather than trixie deliberately: building against the older glibc is what
          # keeps the archive loadable on both, which the assertion below the build holds it to.
          #
          # `werror` is OFF here alone among the matrix, for the reason the `pipewire-minimum`
          # job below states: Raspbian's gcc 12.2.0 has a -Wrestrict false positive on
          # `line += " " + std::to_string(...)`, which has nothing to do with this architecture
          # and would fail the leg for a question it is not here to ask. It fires at
          # src/control_common.cpp:391 and :401 as it does there, and at
          # tests/cli_test.cpp:1133 as well -- that third site being 32-bit-specific, the
          # warning turning on a memcpy size the compiler folds differently where size_t is
          # `unsigned int`. `-Wno-restrict` is not the narrower fix it looks like: it can only
          # be passed through CMAKE_CXX_FLAGS, and the `-Wall` CMakeLists.txt adds with
          # target_compile_options lands after it and turns the warning back on.
          #
          # `runtime_packages` names bookworm's spellings, where the ARMv7 leg above names
          # trixie's, and adds libatomic1: ARMv6 has no LDREXD, so the 64-bit atomics become
          # libatomic calls and the binary carries NEEDED libatomic.so.1.
          - name: linux-armv6
            runner: ubuntu-24.04
            arm32: 'armv6'
            container: 'balenalib/rpi-raspbian:bookworm@sha256:0f3c33faa9d7b1dac778e8afb5854080dcfbddeac7437265598c6076bb0ffc82'
            werror: 'OFF'
            with_mdns: 'ON'
            with_pulse: 'ON'
            with_pipewire: 'ON'
            expect_probe: 'Failed'
            expect_backends: '^-- sendspin-cli audio backends: null, stdout, alsa, portaudio, pulse, pipewire$'
            expect_mdns: '^-- sendspin-cli mDNS: dns_sd \(/usr/lib/arm-linux-gnueabihf/libdns_sd\.so\)$'
            runtime_packages: 'libasound2 libportaudio2 libpulse0 libpipewire-0.3-0 libavahi-compat-libdnssd1 libatomic1'
            publish: true
            avahi: false
            systemd: false

          # Both sound-server backends are pinned OFF here rather than left to auto-detection.
          # libpulse is brew-installable on macOS and could arrive on the image as some other
          # formula's dependency, which would change this line without a commit -- and there is no
          # PipeWire for macOS at all. CoreAudio through PortAudio is the macOS path either way.
          - name: macos-arm64
            runner: macos-14
            arm32: ''
            container: ''
            werror: 'ON'
            with_mdns: 'ON'
            with_pulse: 'OFF'
            with_pipewire: 'OFF'
            expect_probe: 'Success'
            expect_backends: '^-- sendspin-cli audio backends: null, stdout, portaudio$'
            expect_mdns: '^-- sendspin-cli mDNS: dns_sd \(Bonjour, built in\)$'
            runtime_packages: 'portaudio (brew). Bonjour is part of macOS.'
            publish: true
            avahi: false
            systemd: false

          # Compile coverage only, and the reason it is a leg of its own: turning mDNS off
          # swaps which translation unit is built -- src/mdns_null.cpp instead of
          # src/mdns_dnssd.cpp -- so nothing else in the matrix compiles it. It publishes
          # nothing; a binary that cannot be discovered is not one to hand anybody.
          #
          # The two sound-server backends are off here for a second helping of the same idea:
          # tests/device_spec_test.cpp guards half its cases on SENDSPIN_CLI_HAVE_PULSE and
          # _PIPEWIRE, and this is the only Linux leg that compiles and runs the #else arms --
          # the ones that assert a bare `pulse` is still an ALSA PCM name, and that the message
          # for `pulse:<sink>` names the alsa: route as well as the CMake flag.
          - name: linux-x86_64-nomdns
            runner: ubuntu-24.04
            arm32: ''
            container: ''
            werror: 'ON'
            with_mdns: 'OFF'
            with_pulse: 'OFF'
            with_pipewire: 'OFF'
            expect_backends: '^-- sendspin-cli audio backends: null, stdout, alsa, portaudio$'
            expect_mdns: '^-- sendspin-cli mDNS: none$'
            publish: false
            avahi: false
            systemd: true

    steps:
      # Every third-party action here is pinned to a commit rather than a tag, because a tag
      # can be repointed at any time and these run with write access to the workspace. The
      # trailing comment is the version that commit was, for a reader bumping it.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux' && !matrix.arm32
        run: |
          sudo apt-get update
          # pkg-config is named even though the image already has it: it is what finds
          # PortAudio, so a change in the image should fail here rather than silently produce
          # a player with no audio backend.
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libasound2-dev \
            portaudio19-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libavahi-compat-libdnssd-dev

      # In place of the step above rather than beside it, and that is the point: with none of
      # the runner's own -dev packages installed there is no libdns_sd.so or libasound.so of
      # the wrong architecture for find_library to answer with at all. The anchored expect_mdns
      # below is the check that it did not; this is what leaves it nothing to catch.
      #
      # `!matrix.container` as well as `matrix.arm32`: the ARMv6 leg targets 32-bit ARM too and
      # wants none of this. Its toolchain and its :armhf libraries are the container's own, and
      # installing this runner's cross toolchain beside them would put an ARMv7 libgcc within
      # reach of a build whose whole point is not having one.
      - name: Install the cross toolchain and armhf dependencies (cross-compiled 32-bit ARM)
        if: matrix.arm32 && !matrix.container
        run: |
          sudo dpkg --add-architecture armhf

          # Both read off the runner rather than written down, because nothing else here binds
          # them to it. A leg moved to a newer image would otherwise keep asking for this
          # release's armhf packages and link them with the newer image's cross toolchain, and
          # go green doing it -- the same failure the `pipewire-minimum` job's "Assert this
          # image still ships the minimum" step exists to refuse.
          host_arch="$(dpkg --print-architecture)"
          . /etc/os-release
          [ -n "${VERSION_CODENAME:-}" ] || {
            echo '::error::/etc/os-release names no VERSION_CODENAME, so there is no suite to point the armhf source at'
            exit 1
          }
          echo "Cross-building on $host_arch/$VERSION_CODENAME."

          # armhf is a *port*: archive.ubuntu.com carries amd64 and i386 and nothing else. So
          # every source already on this image is pinned to the host architecture -- the
          # third-party ones included, which would otherwise 404 on an armhf index nobody asked
          # them for and fail the update before a single :armhf package is looked at -- and one
          # ports.ubuntu.com source is added carrying armhf alone.
          sources=/etc/apt/sources.list.d/ubuntu.sources
          [ -f "$sources" ] || {
            echo "::error::this image has no $sources; its apt layout has changed and the armhf constraint below no longer lands anywhere"
            exit 1
          }

          # `Types:` opens every deb822 stanza, so that is where the constraint goes. A file
          # that already names its architectures is left alone rather than given a second,
          # contradictory line.
          for f in /etc/apt/sources.list.d/*.sources; do
            [ -e "$f" ] || continue
            grep -q '^Architectures:' "$f" ||
              sudo sed -i "/^Types:/a Architectures: $host_arch" "$f"
          done

          # The one-line format, which third-party repositories on this image still use. Both
          # substitutions skip a line that already names an architecture and nothing else, which
          # is the same question the loop above asks: an entry carrying `signed-by=` alone is
          # unconstrained despite having a bracket, and skipping it on the strength of the
          # bracket is how this whole step would come to pass while doing half its job.
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
            [ -e "$f" ] || continue
            sudo sed -i -E \
              -e "/^deb(-src)? .*arch=/! s|^(deb(-src)?) \[|\1 [arch=$host_arch |" \
              -e "/^deb(-src)? .*arch=/! s|^(deb(-src)?) ([^[])|\1 [arch=$host_arch] \3|" \
              "$f"
          done

          sudo tee /etc/apt/sources.list.d/ubuntu-ports-armhf.sources >/dev/null <<SOURCES
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: $VERSION_CODENAME $VERSION_CODENAME-updates $VERSION_CODENAME-backports $VERSION_CODENAME-security
          Components: main restricted universe multiverse
          Architectures: armhf
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES

          # Both formats, because the one-line files are the fragile half and showing only the
          # deb822 ones would print the part that cannot go wrong.
          echo 'What apt will read:'
          cat /etc/apt/sources.list.d/*.sources
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
            [ -e "$f" ] || continue
            printf '%s:\n' "$f"
            cat "$f"
          done

          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            crossbuild-essential-armhf \
            qemu-user-static \
            pkg-config \
            libasound2-dev:armhf \
            portaudio19-dev:armhf \
            libpulse-dev:armhf \
            libpipewire-0.3-dev:armhf \
            libavahi-compat-libdnssd-dev:armhf

          # qemu-user-static ships its handlers as systemd-binfmt drop-ins under
          # /usr/lib/binfmt.d rather than registering them itself, so this is what puts
          # qemu-arm into the kernel.
          sudo systemctl restart systemd-binfmt

          # Proven here, where the message can say what is wrong, rather than left to surface
          # further down wearing someone else's name: gtest_discover_tests runs the test binary
          # at build time to enumerate its cases and the Package step reads the version off the
          # player, so an unregistered handler breaks `cmake --build` rather than `ctest`.
          printf 'int main(void) { return 0; }\n' >binfmt-probe.c
          arm-linux-gnueabihf-gcc -o binfmt-probe binfmt-probe.c
          ./binfmt-probe || {
            echo '::error::this kernel will not execute a 32-bit ARM binary -- qemu-arm is not registered, so nothing below can run what it builds'
            systemctl status systemd-binfmt --no-pager --full || true
            ls /proc/sys/fs/binfmt_misc || true
            exit 1
          }
          echo 'A 32-bit ARM binary runs on this host.'
          rm -f binfmt-probe binfmt-probe.c

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio pkgconf

      # What puts qemu-arm into the kernel's binfmt_misc, so that the ARM processes in the
      # container below -- gcc and cmake among them, this being a native build rather than a
      # cross one -- can run at all. The cross leg above registers its own handler by hand from
      # qemu-user-static, which is the same mechanism arrived at from the other direction.
      - name: Register the ARM emulator (containerised 32-bit ARM)
        if: matrix.container
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      # Everything from Configure down runs in here. The container is started once and kept,
      # rather than a fresh `docker run` per step: cmake records the directory it was configured
      # in, and the build tree, the suite and the staged payload all have to be the same one.
      - name: Start the Raspbian build container (containerised 32-bit ARM)
        if: matrix.container
        env:
          IMAGE: ${{ matrix.container }}
        run: scripts/build_armv6_container.sh start "$IMAGE"

      # The fetched sources and the populate stamps that record they were fetched -- the
      # stamps live in `-subbuild`, which is a generated CMake tree rather than a download, and
      # without them every run refetches. What is deliberately *not* in here is anything
      # compiled: `-build` is excluded and `build/` is outside this path entirely, so no object
      # file ever survives a compiler upgrade on the runner image. Restoring the downloads is
      # where the time goes anyway -- sendspin-cpp pulls its own dependencies (ixwebsocket,
      # opus, FLAC) through FetchContent in turn.
      #
      # Keyed per leg, and by CMakeLists.txt's hash because it holds both pinned tags. A
      # subbuild left stale by a cmake upgrade on the image is the residual risk, and dropping
      # the cache is its remedy.
      - name: Cache the fetched sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .deps/*-src
            .deps/*-subbuild
          key: deps-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        env:
          WITH_MDNS: ${{ matrix.with_mdns }}
          WITH_PULSE: ${{ matrix.with_pulse }}
          WITH_PIPEWIRE: ${{ matrix.with_pipewire }}
          WERROR: ${{ matrix.werror }}
          DEPS_DIR: ${{ github.workspace }}/.deps
          ARM32: ${{ matrix.arm32 }}
          IMAGE: ${{ matrix.container }}
        run: |
          # Held in one array rather than written out on each side of the branch below. What a
          # cross leg changes is the compiler and the flags naming the target, which
          # scripts/build_arm32.sh owns, and what a containerised leg changes is where cmake
          # runs and the one library that target's atomics need, which
          # scripts/build_armv6_container.sh owns; not one of these options, and a second copy
          # of them is a second place for the paths to stop agreeing about how this project
          # builds.
          options=(
            -DCMAKE_BUILD_TYPE=Release
            -DSENDSPIN_CLI_WERROR="$WERROR"
            -DSENDSPIN_CLI_WITH_MDNS="$WITH_MDNS"
            -DSENDSPIN_CLI_WITH_PULSE="$WITH_PULSE"
            -DSENDSPIN_CLI_WITH_PIPEWIRE="$WITH_PIPEWIRE"
            -DFETCHCONTENT_BASE_DIR="$DEPS_DIR"
          )

          # `$IMAGE` is asked about first, and the order is load-bearing rather than
          # stylistic: the ARMv6 leg carries both keys, and scripts/build_arm32.sh refuses
          # `armv6` by design -- so an `$ARM32` test reached first would fail the leg with a
          # message about a toolchain it never meant to use.
          if [ -n "$IMAGE" ]; then
            scripts/build_armv6_container.sh configure build "${options[@]}" 2>&1 | tee configure.log
          elif [ -n "$ARM32" ]; then
            scripts/build_arm32.sh "$ARM32" build "${options[@]}" 2>&1 | tee configure.log
          else
            cmake -B build "${options[@]}" 2>&1 | tee configure.log
          fi

      # The check that stops a leg passing while quietly building something else. A missing
      # -dev package does not fail the configure -- every backend here is optional and
      # auto-detected by design -- so without this the matrix would happily ship a
      # null-sink-only, mDNS-less binary and call it green.
      #
      # Whole-line matches, anchored: `audio backends:` on its own is also satisfied by the
      # degraded `null, stdout` line, which is the exact failure being guarded against.
      - name: Assert the configure output found what this leg expects
        env:
          EXPECT_BACKENDS: ${{ matrix.expect_backends }}
          EXPECT_MDNS: ${{ matrix.expect_mdns }}
          EXPECT_PROBE: ${{ matrix.expect_probe }}
        run: |
          patterns=("$EXPECT_BACKENDS" "$EXPECT_MDNS")

          # The dns_sd probes are pinned to the answer this host owes, because they fail open:
          # one that reported Failed for an unrelated reason would silently cost two case
          # labels in describe_error(), and nothing else would complain. Empty on the no-mDNS
          # leg, where the probes do not run at all -- and skipped rather than matched, since
          # an empty ERE matches any non-empty file and would fail open in turn.
          if [ -n "$EXPECT_PROBE" ]; then
            for symbol in SERVICE_NOT_RUNNING TIMEOUT; do
              patterns+=("^-- Performing Test SENDSPIN_CLI_HAVE_ERR_$symbol - $EXPECT_PROBE\$")
            done
          fi

          status=0
          for expected in "${patterns[@]}"; do
            if ! grep -Eq -e "$expected" configure.log; then
              echo "::error::configure output has no line matching: $expected"
              status=1
            fi
          done
          echo 'What configure actually reported:'
          grep -E -- '^-- (sendspin-cli|Performing Test SENDSPIN_CLI)' configure.log ||
            echo '(configure.log has no sendspin-cli lines at all)'
          exit "$status"

      - name: Build
        env:
          IMAGE: ${{ matrix.container }}
        run: |
          if [ -n "$IMAGE" ]; then
            scripts/build_armv6_container.sh run cmake --build build
          else
            cmake --build build
          fi

      # What makes these legs' names mean something. Every dependency arrives through
      # FetchContent and so through add_subdirectory, in the one cmake invocation, which is why
      # scripts/build_arm32.sh puts the target flags in CMAKE_C_FLAGS/CMAKE_CXX_FLAGS rather
      # than on our own targets -- and this is the check that says it worked. A flag that
      # reached sendspin-cli and missed a dependency still links, still passes the suite under
      # an emulator permissive enough to run anything, and then traps on the hardware the
      # archive is built for. The linker merges build attributes across every object in the
      # link and reports the highest, so one read covers the whole tree.
      #
      # The ARMv6 leg passes no such flag -- its compiler targets ARMv6 by configuration -- and
      # that is why it needs this read just as much: what it is claiming is a property of a
      # container's whole toolchain, and a dependency that found some other compiler would
      # answer here rather than on a Pi Zero.
      #
      # It covers what is *in* the file and nothing further. The shared libraries the loader
      # pulls in on a Pi are that machine's own, built by whoever built its distribution, and
      # are not this build's to make claims about.
      #
      # Ahead of the suite rather than after it: a binary of the wrong architecture is a fact
      # about the build, and reading it off costs a `readelf` rather than the whole suite run
      # under an emulator.
      - name: Assert the binary is built for the architecture this leg claims
        if: matrix.arm32
        env:
          ARM32: ${{ matrix.arm32 }}
          IMAGE: ${{ matrix.container }}
        run: |
          binary=build/sendspin-cli

          case "$ARM32" in
            armv7) want_arch='v7' ;;
            armv6) want_arch='v6' ;;
            *)
              echo "::error::no expected CPU architecture is recorded here for '$ARM32'"
              exit 1
              ;;
          esac

          # Read into files rather than piped into each check, so that `grep -q` matching early
          # cannot take the writer down with SIGPIPE -- `defaults.run.shell` is `bash -eo
          # pipefail`, where that reads as a failed pipeline. The same reason the systemd step
          # below uses `case` throughout.
          readelf -h "$binary" >elf-header.txt
          readelf -A "$binary" >elf-attributes.txt
          echo 'What the linked binary reports:'
          file "$binary"
          cat elf-header.txt elf-attributes.txt

          field() {
            sed -n "/^[[:space:]]*$1:/ { s/^[[:space:]]*$1:[[:space:]]*//p; q; }" "$2"
          }

          status=0
          expect() {
            [ "$2" = "$3" ] || {
              echo "::error::$1 is '$2', not '$3'"
              status=1
            }
          }

          expect 'the ELF class' "$(field Class elf-header.txt)" 'ELF32'
          expect 'the ELF machine' "$(field Machine elf-header.txt)" 'ARM'
          expect 'Tag_CPU_arch' "$(field Tag_CPU_arch elf-attributes.txt)" "$want_arch"
          # The calling convention, taken from the attribute that records it rather than from
          # the -mfloat-abi this build passed. A soft-float object and a hard-float one disagree
          # about how every function taking a double is called, and nothing refuses the mixture
          # at load time -- it is the arithmetic that comes out wrong.
          expect 'Tag_ABI_VFP_args' "$(field Tag_ABI_VFP_args elf-attributes.txt)" 'VFP registers'

          # Substring-matched, alone among these: the flags word is printed alongside its
          # numeric value, which carries bits that have nothing to do with the ABI being named.
          flags="$(field Flags elf-header.txt)"
          case "$flags" in
            *'hard-float ABI'*) ;;
            *)
              echo "::error::the ELF header flags are '$flags', which do not declare the hard-float EABI"
              status=1
              ;;
          esac

          # The one thing BUILD-INFO.txt claims that is not about the instruction set: that
          # this archive loads on Raspberry Pi OS bookworm as well as trixie. It rests on the
          # highest glibc symbol version the binary references, so it is read off the file the
          # way everything else here is -- and a container digest that moved off bookworm would
          # raise it silently, leaving the text inside the archive promising a Pi Zero owner
          # something their loader would refuse. Bookworm's own 2.36 is the bound, rather than
          # the lower number this happens to come out at, because that is the claim being made.
          if [ -n "$IMAGE" ]; then
            bookworm_glibc=GLIBC_2.36
            readelf --version-info "$binary" >elf-versions.txt
            floor="$(grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' elf-versions.txt | sort -uV | tail -1 || true)"
            rm -f elf-versions.txt

            if [ -z "$floor" ]; then
              echo '::error::no GLIBC_ symbol version could be read off the binary, so the claim BUILD-INFO.txt makes about bookworm cannot be checked'
              status=1
            else
              echo "The highest glibc symbol version this binary references: $floor"
              # The higher of the two, compared against the bound: equal is fine, above is not.
              if [ "$(printf '%s\n%s\n' "$floor" "$bookworm_glibc" | sort -V | tail -1)" != "$bookworm_glibc" ]; then
                echo "::error::this binary references $floor, above the $bookworm_glibc Raspberry Pi OS bookworm carries -- its loader would refuse the archive this leg is about to publish"
                status=1
              fi
            fi
          fi

          rm -f elf-header.txt elf-attributes.txt
          exit "$status"

      # Run on every leg, the no-mDNS one included: the suite links sendspin-cli-core, so
      # discovery_test.cpp is compiled against whichever MdnsService went in. That
      # configuration has no other coverage in this matrix.
      #
      # Serial deliberately: daemon_test.cpp exercises flock paths and last_server_test writes
      # real files, neither of which is obviously safe to run against itself in parallel.
      - name: Test
        env:
          IMAGE: ${{ matrix.container }}
        run: |
          if [ -n "$IMAGE" ]; then
            scripts/build_armv6_container.sh run ctest --test-dir build --output-on-failure
          else
            ctest --test-dir build --output-on-failure
          fi

      # Deliberately before avahi-daemon is installed below. With no daemon to register with,
      # this is what exercises the non-fatal advertise-failure path in src/main.cpp -- the
      # player has to come up and warn rather than exit.
      - name: Smoke test
        if: matrix.publish
        env:
          IMAGE: ${{ matrix.container }}
        run: |
          if [ -n "$IMAGE" ]; then
            scripts/build_armv6_container.sh run scripts/smoke_test.sh build/sendspin-cli
          else
            scripts/smoke_test.sh build/sendspin-cli
          fi

      # The one *runtime* claim this matrix owes roadmap item 5, which was built and exercised
      # against Bonjour only: that libavahi-compat-libdnssd really implements the calls
      # src/mdns_dnssd.cpp makes of it. Reading its sources said so; this runs it.
      #
      # Two halves, because they cover different calls. Browsing our own advertisement back
      # proves DNSServiceRegister reached the daemon. Discovering a server proves the rest of
      # the chain -- Browse, Resolve, and above all DNSServiceQueryRecord for A and AAAA, which
      # the compat layer implements in place of the DNSServiceGetAddrInfo it lacks entirely: a
      # ws:// URL cannot be built at all without an address that query returned.
      - name: Advertise and discover through a real Avahi daemon
        if: matrix.avahi
        run: |
          sudo apt-get install --no-install-recommends -y avahi-daemon avahi-utils
          sudo systemctl start avahi-daemon

          # Waited for rather than assumed: the socket is what the compat layer connects to,
          # and starting the player before it exists would leave the whole check riding on the
          # player's own retry ramp landing inside the polls below.
          for _ in $(seq 1 200); do
            if [ -S /run/avahi-daemon/socket ]; then break; fi
            sleep 0.1
          done
          [ -S /run/avahi-daemon/socket ] || {
            echo '::error::avahi-daemon was started but its socket never appeared'
            systemctl status avahi-daemon --no-pager || true
            exit 1
          }

          instance="sendspin-ci-$GITHUB_RUN_ID"

          # Half one: our advertisement, browsed back and resolved to an address.
          ./build/sendspin-cli -o null --port 39301 --mdns-name "$instance" >advertise.log 2>&1 &
          player=$!
          trap 'kill -TERM "$player" 2>/dev/null || true' EXIT

          for _ in $(seq 1 200); do
            if grep -q 'advertising _sendspin\._tcp' advertise.log; then break; fi
            sleep 0.1
          done
          grep -q 'advertising _sendspin\._tcp' advertise.log || {
            echo '::error::the player never registered its advertisement'
            cat advertise.log
            exit 1
          }

          # -p is the parseable form: resolved records come back as `=;iface;proto;instance;...`
          # with the address in field 8 and the port in field 9.
          avahi-browse -rpt _sendspin._tcp >browse.txt
          echo 'What avahi-browse resolved:'
          cat browse.txt
          awk -F';' -v want="$instance" '
            $1 == "=" && $4 == want && $8 != "" && $9 == "39301" { found = 1 }
            END { exit found ? 0 : 1 }
          ' browse.txt || {
            echo "::error::$instance was not browsable with a resolved address on port 39301"
            exit 1
          }

          # Guarded like the traps are: everything this half set out to prove is already
          # proven, so a player that has since exited on its own must not turn the leg red
          # here with nothing said about why.
          kill -TERM "$player" 2>/dev/null || true
          wait "$player" 2>/dev/null || true
          trap - EXIT

          # Half two: a server published into the same daemon, discovered and resolved by our
          # own dns_sd code. Nothing is listening on 8927 and no dial is asserted -- what is
          # asserted is that a ws:// URL was built at all, which takes an address, which takes
          # a QueryRecord that answered.
          #
          # TXT `name` as well as the REQUIRED `path`, because -s mdns:<name> filters on the
          # former: without it the instance resolves but matches nothing, and the filter goes
          # untested.
          avahi-publish -s "$instance-server" _sendspin-server._tcp 8927 \
            'path=/sendspin' "name=$instance-server" &
          publisher=$!
          trap 'kill -TERM "$publisher" 2>/dev/null || true' EXIT

          ./build/sendspin-cli -o null --port 39302 -s "mdns:$instance-server" \
            >discover.log 2>&1 &
          client=$!
          trap 'kill -TERM "$client" "$publisher" 2>/dev/null || true' EXIT

          resolved="found server \"$instance-server\" .* at ws://"
          for _ in $(seq 1 300); do
            if grep -q "$resolved" discover.log; then break; fi
            sleep 0.1
          done
          echo 'What the discovering client logged:'
          cat discover.log
          grep -q "$resolved" discover.log || {
            echo '::error::the server was published but never resolved to a ws:// URL'
            exit 1
          }

          kill -TERM "$client" "$publisher" 2>/dev/null || true

      # A build output for trying a commit on real hardware, staged by the same `install()`
      # rules an operator would use. DESTDIR rather than `--prefix`, so every path in the
      # archive is the path the file installs to: the unit's ExecStart is absolute and names the
      # configure-time prefix, and `--prefix` would relocate the payload around it without
      # changing what it says -- leaving a unit pointing at a binary the archive does not hold.
      #
      # `--component sendspin-cli` is what keeps the payload ours. Fetched dependencies declare
      # install() rules of their own that no option turns off, and CMakeLists.txt says which.
      #
      # Tarred rather than handed to upload-artifact loose because the artifact is served as a
      # zip, and zip does not carry the executable bit -- an untarred binary would arrive
      # chmod-less.
      - name: Package
        if: matrix.publish
        id: package
        env:
          RUNTIME_PACKAGES: ${{ matrix.runtime_packages }}
          LEG: ${{ matrix.name }}
          ARM32: ${{ matrix.arm32 }}
          IMAGE: ${{ matrix.container }}
        run: |
          # Both the version read and the install below go through the container on the leg that
          # has one. The binary is the obvious half; the install is the less obvious one, and it
          # is not about executing anything -- cmake_install.cmake was written by the container's
          # cmake 3.25 and is read back by whichever cmake runs it, and the files it lays down
          # have to arrive owned the way everything else in this workspace is.
          if [ -n "$IMAGE" ]; then
            reported="$(scripts/build_armv6_container.sh run ./build/sendspin-cli --version)"
          else
            reported="$(./build/sendspin-cli --version)"
          fi
          version="$(printf '%s\n' "$reported" | awk 'NR == 1 { print $2 }')"
          lib_tag="$(printf '%s\n' "$reported" | awk 'NR == 2 { print $2 }')"
          name="sendspin-cli-$version-$LEG"

          mkdir -p "stage/$name"
          if [ -n "$IMAGE" ]; then
            scripts/build_armv6_container.sh run \
              env DESTDIR="$PWD/stage/$name" cmake --install build --component sendspin-cli
          else
            DESTDIR="$PWD/stage/$name" cmake --install build --component sendspin-cli
          fi

          cat >"stage/$name/BUILD-INFO.txt" <<INFO
          sendspin-cli $version for $LEG
          Built from commit $GITHUB_SHA on $RUNNER_OS/$RUNNER_ARCH
          Linked against sendspin-cpp $lib_tag

          Runtime packages this binary needs:
            $RUNTIME_PACKAGES

          Every path under usr/ here is where the file installs to, so it goes in with one
          command from the directory holding the tarball:

            sudo tar -xzf $name.tar.gz --strip-components=1 -C / $name/usr

          Naming $name/usr is what leaves this file behind rather than unpacking it at /.

          Or run it where you unpacked it: ./$name/usr/local/bin/sendspin-cli --help

          This build is configured for the /usr/local prefix, which is why those paths are
          what they are.
          INFO

          # Appended only where it applies, and carried inside the archive rather than left in
          # README alone: someone who unpacked this on a Mac and got told the developer cannot
          # be verified is holding the tarball, not the repository.
          if [ "$RUNNER_OS" = 'macOS' ]; then
            cat >>"stage/$name/BUILD-INFO.txt" <<MACOS

          This binary is ad-hoc signed -- the minimum arm64 needs to run at all -- so it
          carries no developer identity and Gatekeeper has nothing to check it against.
          Unpack with \`tar -xzf\` from a terminal, which does not propagate the quarantine
          flag where Finder's Archive Utility does. If macOS refuses it anyway:

            xattr -d com.apple.quarantine ./$name/usr/local/bin/sendspin-cli

          There is an installer .pkg beside this tarball in the same build, and on every
          release, holding the same files. It is unsigned too, and it is not the Gatekeeper
          fix -- what it fixes is that \`installer\` makes no assessment at all, and that it
          is the shape a notarization ticket can later be stapled to. A Developer ID
          signature and notarization are still owed; see README.md.
          MACOS
          else
            cat >>"stage/$name/BUILD-INFO.txt" <<'LINUX'

          The systemd unit is at usr/local/lib/systemd/system/sendspin-cli.service, which is
          on systemd's own search path, so installing as above needs no copying. The one
          command a tarball cannot run for itself creates the account the unit runs as,
          declared beside it in usr/local/lib/sysusers.d/sendspin-cli.conf:

            sudo systemd-sysusers
            sudo systemctl daemon-reload
            sudo systemctl enable --now sendspin-cli

          Skip the first line and the unit will not start: systemctl reports 217/USER.

          It runs the player as an unprivileged sendspin-cli user, in the foreground, with its
          state in /var/lib/sendspin-cli and its control socket in /run/sendspin-cli. An
          existing /var/lib/sendspin-cli left behind by an earlier root-run version needs
          nothing done to it -- systemd chowns it. Configure it in
          /etc/sendspin-cli.conf; there is an annotated example beside the installed README,
          under usr/local/share/doc/sendspin-cli. Its ExecStart names /usr/local/bin/sendspin-cli
          absolutely, so a binary put anywhere else needs the unit changed to match.
          LINUX
          fi

          # Said inside the archive, because the lines above it are read on the machine this was
          # built *for* while naming the machine it was built *on*: "Built from commit ... on
          # Linux/X64", under a heading that says linux-armv7, is accurate and baffling at once
          # until something accounts for it.
          #
          # Two blocks rather than one with the differences papered over, and the ARMv6 one is
          # asked about first for the reason the Configure step's branch is: that leg carries
          # both keys. Nothing the cross block says is true of it. It is not a cross build; its
          # runtime package names are bookworm's rather than trixie's; and the glibc paragraph
          # is exactly inverted, bookworm being what this one is *built on* rather than what it
          # refuses to load on. This text is read on a Pi, which is the whole reason it is
          # carried inside the archive.
          if [ -n "$IMAGE" ]; then
            # Read off the binary rather than written down, so the line below cannot drift from
            # what was actually built. The assertion further up has already refused anything
            # above the 2.36 bookworm itself carries; this is what says how far below it came in.
            glibc_floor="$(readelf --version-info build/sendspin-cli |
              grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -uV | tail -1)"

            cat >>"stage/$name/BUILD-INFO.txt" <<EMULATED

          This was built for an ARM1176 -- a Pi Zero, a Pi Zero W or an original Pi -- inside a
          Raspbian container on the runner named above, and not on a Pi. It is a native build
          rather than a cross build: Raspbian's own gcc, libgcc and startup objects are ARMv6,
          which is what makes this archive ARMv6, and the build attributes of the binary are
          asserted to say ARMv6, hard-float EABI before the archive is made. Its unit suite and
          smoke test ran there under qemu-user pinned to an ARM1176, so the emulator was no more
          permissive than your hardware -- but what is proven is that the code builds and
          behaves, not that it was tried on a Pi.

          The runtime packages above are spelled the way Raspberry Pi OS bookworm spells them;
          on trixie they are libasound2t64 and libpipewire-0.3-0t64. This binary needs no glibc
          symbol newer than ${glibc_floor#GLIBC_}, which is below what either release carries.
          So it loads on both -- which the linux-armv7 archive does not.
          EMULATED
          elif [ -n "$ARM32" ]; then
            cat >>"stage/$name/BUILD-INFO.txt" <<CROSS

          This is a cross build. It was compiled for $ARM32 on the runner named above, and its
          unit suite and smoke test were run there under qemu-user rather than on a Raspberry
          Pi -- so what is proven is that the code builds and behaves, not that it was tried on
          the hardware. The build attributes of the binary are asserted to be $ARM32,
          hard-float EABI, before this archive is made.

          It is built for Raspberry Pi OS trixie, and the runtime packages above are spelled
          the way trixie spells them. On bookworm they are libasound2 and libpipewire-0.3-0,
          without the t64 -- but that is the smaller problem: this binary needs glibc 2.38 and
          bookworm has 2.36, so its loader refuses it outright with "version \`GLIBC_2.38' not
          found". Move that Pi to trixie, or build from source on it.
          CROSS
          fi

          tar -czf "$name.tar.gz" -C stage "$name"
          echo "name=$name" >>"$GITHUB_OUTPUT"
          # Carried out of this step rather than derived again by the installer step below: the
          # version is read off the binary above, and reading it twice is two things to keep
          # agreeing about what this build is called.
          echo "version=$version" >>"$GITHUB_OUTPUT"

      # What the payload holds, asserted rather than assumed -- the same check the configure
      # output gets above, and for the same reason. Two things go wrong silently otherwise: a
      # dependency that starts declaring install() rules on a SENDSPIN_GIT_TAG bump adds a
      # static library and a tree of headers to a tarball nobody reads the manifest of, and a
      # file dropped from our own install() rules leaves an archive that is merely smaller.
      - name: Assert the payload holds exactly what it should
        if: matrix.publish
        env:
          NAME: ${{ steps.package.outputs.name }}
        run: |
          expected=$(mktemp)
          {
            echo BUILD-INFO.txt
            echo usr/local/bin/sendspin-cli
            echo usr/local/share/doc/sendspin-cli/LICENSE
            echo usr/local/share/doc/sendspin-cli/README.md
            echo usr/local/share/doc/sendspin-cli/sendspin-cli.conf.example
            # Installed on Linux alone: a systemd unit, and the account declaration it needs,
            # are both files a Mac can only ignore.
            if [ "$RUNNER_OS" = 'Linux' ]; then
              echo usr/local/lib/sysusers.d/sendspin-cli.conf
              echo usr/local/lib/systemd/system/sendspin-cli.service
            fi
          } | sort >"$expected"

          # `! -type d` rather than `-type f`, so a symlink into the payload is a difference
          # rather than an invisible one.
          actual=$(mktemp)
          (cd "stage/$NAME" && find . ! -type d | sed 's|^\./||') | sort >"$actual"

          echo 'What the payload holds:'
          cat "$actual"
          diff -u "$expected" "$actual" || {
            echo '::error::the staged payload is not the file list this workflow expects'
            exit 1
          }

          # And again from inside the archive that actually ships, since that is one `tar` away
          # from the directory checked above and it is the artifact anybody downloads. The
          # executable bit is asserted here too: it is the reason this is a tarball at all, the
          # artifact being served as a zip that does not carry one.
          # Directory entries dropped before the prefix is stripped, since both tars list them
          # with a trailing slash -- including the archive's own top-level one, which would
          # otherwise strip down to an empty line and read as a difference.
          tar -tzf "$NAME.tar.gz" | grep -v '/$' | sed -n "s|^$NAME/||p" | sort >"$actual"
          diff -u "$expected" "$actual" || {
            echo '::error::the tarball does not hold what the staged payload does'
            exit 1
          }
          [ -x "stage/$NAME/usr/local/bin/sendspin-cli" ] || {
            echo '::error::the staged sendspin-cli is not executable'
            exit 1
          }

      # The unit file is the one thing in the payload this matrix can check and no developer on
      # macOS can, so it is checked here rather than read. Installed at the real prefix first,
      # because `systemd-analyze verify` resolves ExecStart and reports a binary that is not
      # there -- so this exercises the install rules at the prefix the unit names as well, which
      # the staged payload above deliberately does not.
      #
      # After Package, because that is what keeps the ordering safe: a component install writes
      # its manifest into the *build* directory, so a root-owned
      # build/install_manifest_sendspin-cli.txt left here would make the unprivileged staging
      # install above fail on EACCES. Unprivileged first, root over the top. The macOS steps
      # below are the same hazard's other half and sit after Package for the same reason,
      # though `installer` writes to /usr/local rather than into the build tree.
      #
      # `verify` is only a parse, so the step below runs the thing as well. What it cannot cover
      # is the audio path: a runner has no sound card, which is why `output = null` goes in the
      # config and why the unit ships no directive that gates /dev/snd.
      #
      # Gated on `systemd` rather than on `runner.os == 'Linux'`, which is what a cross leg
      # would also satisfy while having nothing to offer here. Running the unit against a
      # binary the runner can only reach through an emulator tests the emulator: qemu-user
      # translates guest code into buffers it writes and then executes, which the unit's
      # `MemoryDenyWriteExecute=yes` forbids outright, so the leg would fail on a directive the
      # player itself has no quarrel with. The unit in the arm32 archive is the same file these
      # legs verify, installed by the same rules.
      - name: Install at the real prefix and verify the systemd unit
        if: matrix.systemd
        run: |
          sudo cmake --install build --component sendspin-cli
          unit=/usr/local/lib/systemd/system/sendspin-cli.service
          [ -f "$unit" ] || {
            echo "::error::the install put no unit at $unit"
            exit 1
          }
          echo "What was installed as $unit:"
          cat "$unit"
          systemd-analyze verify "$unit"

      # The unit run as the account it names, with the hardening block in place. A runner is a
      # real machine with systemd as PID 1 -- the Avahi step above already leans on that -- so
      # every claim the unit's comment makes short of `/dev/snd` can be made here rather than
      # reasoned about, and a directive that boots on a maintainer's laptop and not on a stock
      # 24.04 fails a leg instead of an operator's install.
      #
      # `systemd-sysusers` with no argument is the same command README tells an operator to run,
      # reading the fragment the install rules just put in /usr/local/lib/sysusers.d -- so this
      # covers the search path holding for /usr/local as well as the fragment's own content.
      - name: Run the unit as its own user, with the hardening block
        if: matrix.systemd
        env:
          AVAHI: ${{ matrix.avahi }}
        run: |
          # Defined first so that everything below, `systemctl start` included, reports the
          # journal rather than dying on `set -e` with nothing but a non-zero exit to show.
          fail() {
            echo "::error::$1"
            systemctl status sendspin-cli --no-pager --full || true
            journalctl -u sendspin-cli --no-pager | tail -40 || true
            exit 1
          }

          sudo systemd-sysusers
          id sendspin-cli
          # A case match rather than a pipe into grep, which is the shape every check in this
          # step uses: `defaults.run.shell` is `bash -eo pipefail`, and `grep -q` exits the
          # instant it matches, so the writer on the left takes SIGPIPE and pipefail then reads
          # a *successful* match as a failed pipeline.
          case " $(id -nG sendspin-cli) " in
            *' audio '*) ;;
            *)
              echo '::error::the sysusers fragment did not put sendspin-cli in the audio group'
              exit 1
              ;;
          esac

          # A runner has no card, and the unit deliberately carries no -o: the config file is
          # where an operator picks one, so it is where this picks one too.
          printf '%s\n' 'output = null' | sudo tee /etc/sendspin-cli.conf >/dev/null

          # The upgrade path, asserted rather than described: a root-owned state directory from
          # an earlier root-run version, which StateDirectory= has to take over on its own.
          sock=/run/sendspin-cli/control.sock
          sudo rm -rf /var/lib/sendspin-cli
          sudo install -d -m 0700 /var/lib/sendspin-cli
          printf '%s\n' '# Written by sendspin-cli. Edits are overwritten.' \
            'static-delay-ms = 175' | sudo tee /var/lib/sendspin-cli/state >/dev/null
          sudo chmod 0600 /var/lib/sendspin-cli/state

          sudo systemctl daemon-reload
          sudo systemctl start sendspin-cli || fail 'systemctl start refused the unit'
          for _ in $(seq 1 100); do [ -S "$sock" ] && break; sleep 0.2; done

          [ "$(systemctl is-active sendspin-cli)" = active ] || fail 'the unit did not start'

          # Numeric uids on both sides, the way scripts/smoke_test.sh already compares them:
          # `ps -o user=` prints the uid instead of the name once the name outgrows the column,
          # so a name comparison is one rename away from being a comparison of nothing.
          main=$(systemctl show -p MainPID --value sendspin-cli)
          [ "$main" != 0 ] || fail 'the unit reports no main process'
          owner=$(ps -o uid= -p "$main" | tr -d ' ') || fail "no process with pid $main"
          [ "$owner" = "$(id -u sendspin-cli)" ] ||
            fail "the player runs as uid $owner, not sendspin-cli ($(id -u sendspin-cli))"

          status=$(sudo sendspin-cli status --control-socket "$sock") ||
            fail 'the control socket did not answer status'
          printf '%s\n' "$status"

          # Read back rather than merely chowned: 175 came from the root-owned file planted
          # above, so seeing it proves systemd handed the whole directory over intact.
          case "$status" in
            *'static delay: 175 ms'*) ;;
            *) fail 'the state left by a root-run player did not survive the ownership change' ;;
          esac

          sudo sendspin-cli delay 250 --control-socket "$sock" || fail 'delay was refused'
          for _ in $(seq 1 50); do
            [ "$(stat -c '%U %a' /var/lib/sendspin-cli/state 2>/dev/null)" = 'sendspin-cli 600' ] &&
              break
            sleep 0.2
          done
          state=$(stat -c '%U %a' /var/lib/sendspin-cli/state 2>/dev/null)
          [ "$state" = 'sendspin-cli 600' ] || fail "the state file is '$state', not 'sendspin-cli 600'"

          # Only on the leg that started a real avahi-daemon above, and the one claim the rest of
          # this step cannot make: that RestrictAddressFamilies= without AF_NETLINK still reaches
          # the daemon over AF_UNIX. Registration is asynchronous, so it is waited for.
          if [ "$AVAHI" = 'true' ]; then
            # Scoped to this invocation rather than `-u sendspin-cli`, which prints every start
            # the unit has ever had: a run that failed to advertise would otherwise match the
            # line an earlier one logged and pass. A fail-open gate is worse than no gate.
            invocation=$(systemctl show -p InvocationID --value sendspin-cli)
            [ -n "$invocation" ] || fail 'the unit reports no invocation id to scope the journal to'
            for _ in $(seq 1 100); do
              journalctl "_SYSTEMD_INVOCATION_ID=$invocation" --no-pager >journal.log
              if grep -q 'mdns: advertising _sendspin\._tcp' journal.log; then break; fi
              sleep 0.2
            done
            grep -q 'mdns: advertising _sendspin\._tcp' journal.log ||
              fail 'the mDNS advertisement never reached avahi-daemon under the hardening block'
          fi

          sudo systemctl restart sendspin-cli || fail 'the unit would not restart'
          for _ in $(seq 1 100); do [ -S "$sock" ] && break; sleep 0.2; done
          status=$(sudo sendspin-cli status --control-socket "$sock") ||
            fail 'the control socket did not answer status after a restart'
          case "$status" in
            *'static delay: 250 ms'*) ;;
            *) fail 'the 250 ms set over the socket did not survive a restart' ;;
          esac

          # Restart=on-failure covering the case it exists for. RestartSec is 5s, so the poll
          # below has to outlast it -- and a new MainPID is what says it really came back rather
          # than the old one still being reported.
          main=$(systemctl show -p MainPID --value sendspin-cli)
          sudo kill -9 "$main"
          for _ in $(seq 1 100); do
            now=$(systemctl show -p MainPID --value sendspin-cli)
            [ "$now" != "$main" ] && [ "$now" != 0 ] &&
              [ "$(systemctl is-active sendspin-cli)" = active ] && break
            sleep 0.2
          done
          [ "$(systemctl is-active sendspin-cli)" = active ] &&
            [ "$(systemctl show -p MainPID --value sendspin-cli)" != "$main" ] ||
            fail 'the unit did not come back after SIGKILL'

          sudo systemctl stop sendspin-cli
          result=$(systemctl show -p Result --value sendspin-cli)
          [ "$result" = success ] || fail "stopping the unit left Result=$result"

          # Printed rather than asserted: a score is evidence for a reader, and pinning a number
          # would make an unrelated systemd release fail this leg for saying so differently.
          systemd-analyze security sendspin-cli --no-pager || true

      # The macOS half of the same idea: the payload staged above, wrapped into the installer
      # anybody on a Mac would rather double-click than untar. `scripts/build_macos_pkg.sh` owns
      # how, and is a script rather than lines here so a developer can build the same .pkg from
      # the same payload without a runner -- and so ci.yml's shellcheck job already gates it.
      #
      # Here rather than in ci.yml because this file is what release.yml calls too: the .pkg is a
      # release asset, and an installer only a branch push produced would be exactly the seam the
      # no-inputs comment at the top of this file refuses.
      - name: Build the macOS installer .pkg
        if: matrix.publish && runner.os == 'macOS'
        env:
          NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: scripts/build_macos_pkg.sh "stage/$NAME" "$VERSION" "$NAME.pkg"

      # An installer nobody installed is not shipped, and item 10 named this the untested half
      # of the payload. So the .pkg goes in at `/` on the runner and the checks are made of what
      # came out: the file list from its own receipt, then the installed binary answering
      # --version, then the whole smoke suite against it rather than against build/sendspin-cli.
      #
      # `pkgutil --files` prints paths relative to the receipt's install location -- /usr/local,
      # not `/` -- so this expected list is shorter than the tarball's above rather than a copy
      # of it. The `._` filter is kept even though this listing does not currently need one, and
      # the asymmetry is the point. macOS stamps every payload file with a com.apple.provenance
      # extended attribute that cannot be removed (`xattr -c` is undone before the next stat), and
      # pkgbuild carries extended attributes as AppleDouble members -- so the .pkg's *own* BOM
      # does list `._` siblings, which is what `lsbom` shows when the archive is expanded. The
      # receipt's does not, because installer folds those members back into attributes rather than
      # writing files. Filtering rather than naming them keeps this right in both directions: if a
      # future installer stops folding them, the assertion still passes.
      #
      # Last among the macOS steps for the sibling of the reason the Linux install above is: the
      # payload assertion reads `stage/`, and this writes the same four files to the paths they
      # install to. It also runs the smoke suite a second time, which the fixed ports 39281-39288
      # require be sequential with the first.
      - name: Install the .pkg and verify what it put on disk
        if: matrix.publish && runner.os == 'macOS'
        env:
          NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
          # Spelled out here as well as in the script, deliberately. It is the string an operator
          # types to `pkgutil --forget`, so changing it orphans every receipt already on disk --
          # naming it independently is what makes that a change somebody has to mean, rather than
          # one that follows an edit to the script and goes green.
          IDENTIFIER: io.github.chrisuthe.sendspin-cli
        run: |
          sudo installer -pkg "$NAME.pkg" -target /

          echo 'What the receipt says was installed:'
          pkgutil --pkg-info "$IDENTIFIER"

          # The version is threaded from the Package step rather than derived again here, so it
          # is read back off the receipt to check it arrived. An empty one cannot reach this far
          # -- build_macos_pkg.sh refuses it, rather than letting both sides of this comparison
          # be the same empty string.
          info="$(pkgutil --pkg-info "$IDENTIFIER")"
          version="$(printf '%s\n' "$info" | sed -n 's|^version: ||p')"
          [ "$version" = "$VERSION" ] || {
            echo "::error::the receipt names version '$version', not '$VERSION'"
            exit 1
          }

          # Slashes trimmed at both ends before comparing: pkgutil prints a receipt's location
          # relative to the volume and with a trailing slash -- `Library/Apple/` -- and the two
          # spellings mean the same directory.
          location="$(printf '%s\n' "$info" | sed -n 's|^location: ||p' | sed 's|^/*||; s|/*$||')"
          [ "$location" = 'usr/local' ] || {
            echo "::error::the receipt installs into '$location', not usr/local"
            exit 1
          }

          expected=$(mktemp)
          {
            echo bin/sendspin-cli
            echo share/doc/sendspin-cli/LICENSE
            echo share/doc/sendspin-cli/README.md
            echo share/doc/sendspin-cli/sendspin-cli.conf.example
          } | sort >"$expected"

          # Echoed raw before anything filters or sorts it, the way the configure and payload
          # assertions above print what they are about to judge. A wrong identifier has already
          # failed at the --pkg-info above; what this covers is the filter, which would otherwise
          # report a difference having quietly eaten the lines that explain it.
          echo 'What the receipt lists, unfiltered:'
          pkgutil --files "$IDENTIFIER"

          actual=$(mktemp)
          pkgutil --files "$IDENTIFIER" --only-files | grep -Ev '(^|/)\._' | sort >"$actual"

          echo 'What the installed package holds:'
          cat "$actual"
          diff -u "$expected" "$actual" || {
            echo '::error::the installed .pkg is not the file list this workflow expects'
            exit 1
          }
          [ -x /usr/local/bin/sendspin-cli ] || {
            echo '::error::the installed sendspin-cli is not executable'
            exit 1
          }

          /usr/local/bin/sendspin-cli --version
          scripts/smoke_test.sh /usr/local/bin/sendspin-cli

      - name: Upload
        if: matrix.publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.tar.gz
          # Long enough to bisect a regression against, short enough that per-commit builds of
          # every branch do not accumulate. This artifact is never itself a release: on a tag
          # it is how the tarball reaches release.yml's release job, which attaches it to a
          # release of its own and leaves this copy to expire on the same clock.
          retention-days: 14
          if-no-files-found: error

      # A second step rather than a second path on the one above, because `if-no-files-found:
      # error` is wanted on both and a .pkg path there would fail every Linux leg. The artifact
      # name has to differ from the tarball's for the same reason it is a step of its own:
      # upload-artifact refuses to write two artifacts under one name.
      #
      # release.yml names this file in the asset set it asserts before it publishes, which is the
      # third thing the matrix comment above says a publishing leg owes.
      - name: Upload the macOS installer
        if: matrix.publish && runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}-installer
          path: ${{ steps.package.outputs.name }}.pkg
          retention-days: 14
          if-no-files-found: error

      # `always()` because a leg that failed still leaves a container behind, and because this
      # is what keeps `stop` a verb the script's own usage can promise -- exercised by the file
      # that documents it rather than only on a developer's machine. The runner is discarded
      # either way, so nothing here depends on it having run.
      - name: Stop the build container (containerised 32-bit ARM)
        if: always() && matrix.container
        run: scripts/build_armv6_container.sh stop

  # A job of its own rather than a seventh matrix leg -- and not because a matrix leg cannot run
  # its build in a container, since the linux-armv6 one does. What keeps this out is that it
  # publishes nothing: it has one question to answer and no binary to hand anybody, so
  # `publish`, `avahi`, `systemd`, `arm32`, `container` and `runtime_packages` would all be keys
  # it owed and none of them would mean anything. The matrix's own steps are built for hosted
  # runners besides, using `sudo apt-get` and Ubuntu's package names.
  pipewire-minimum:
    name: linux-x86_64-pipewire-min
    runs-on: ubuntu-24.04
    # Debian 12 is the whole reason this exists: it ships libpipewire 0.3.65, the oldest release
    # that satisfies SENDSPIN_CLI_PIPEWIRE_MIN_VERSION, and it is what Raspberry Pi OS bookworm
    # is -- which is the floor still in the field rather than the current release, Raspberry Pi
    # OS having moved to trixie. Every hosted image carries 1.x, where a pw_core_events member added after 0.3.65
    # initialises cleanly -- so with only those legs the floor the README advertises goes
    # untested until somebody on bookworm tries to build and finds a designated initialiser
    # naming a member their header does not declare. That is a compile error, not a warning.
    container: debian:12
    timeout-minutes: 30
    steps:
      # Before the checkout, and with no sudo: the image runs as root already, and it has
      # neither git nor a CA bundle -- both of which actions/checkout needs before it can run.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y             build-essential             cmake             git             ca-certificates             pkg-config             libasound2-dev             libpulse-dev             libpipewire-0.3-dev

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Without this the job rots into a duplicate of the hosted legs. If bookworm ever moves to
      # a 1.x libpipewire it would still build, still go green, and still claim in its name to
      # have tested the floor -- while testing exactly what ubuntu-24.04 already does. Both ends
      # are pinned: at or above the declared minimum, and still an 0.3 release.
      - name: Assert this image still ships the minimum
        run: |
          version=$(pkg-config --modversion libpipewire-0.3)
          minimum=$(grep -oE 'SENDSPIN_CLI_PIPEWIRE_MIN_VERSION [0-9.]+' CMakeLists.txt | awk '{print $2}')
          echo "libpipewire $version, against a declared minimum of $minimum"
          if ! pkg-config --atleast-version="$minimum" libpipewire-0.3; then
            echo "::error::libpipewire $version is below the declared minimum $minimum"
            exit 1
          fi
          if ! pkg-config --max-version=0.3.999 libpipewire-0.3; then
            echo "::error::libpipewire $version is no longer an 0.3 release, so this job has stopped testing the floor it is named for -- repoint it at an image that still ships one, or lower SENDSPIN_CLI_PIPEWIRE_MIN_VERSION deliberately"
            exit 1
          fi

      # -Werror is off here, as it is on the linux-armv6 leg above and for the same reason --
      # absent altogether in this job, spelled `werror: 'OFF'` there because a matrix key an
      # omitted leg would read as falsy has to be written down. gcc 12 has a -Wrestrict false
      # positive on `line += " " + std::to_string(...)` in src/control_common.cpp, which has
      # nothing to do with either sound-server backend and would fail this job for a reason it
      # ask about. The warning line is held on every leg with a newer compiler; what is held
      # here is that the code compiles at all against the oldest libpipewire this project
      # claims to support.
      - name: Configure
        run: |
          cmake -B build             -DCMAKE_BUILD_TYPE=Release             -DSENDSPIN_CLI_WITH_PORTAUDIO=OFF             -DSENDSPIN_CLI_WITH_MDNS=OFF             2>&1 | tee configure.log

      # The same guard the matrix carries, and for a sharper reason here: a missing
      # libpipewire-0.3-dev does not fail the configure, so without this the job would build a
      # binary with no PipeWire backend in it and prove precisely nothing about the minimum.
      - name: Assert the configure output found PipeWire
        run: |
          expected='^-- sendspin-cli audio backends: null, stdout, alsa, pulse, pipewire$'
          if ! grep -Eq -e "$expected" configure.log; then
            echo "::error::configure output has no line matching: $expected"
            grep -E -- '^-- sendspin-cli' configure.log ||
              echo '(configure.log has no sendspin-cli lines at all)'
            exit 1
          fi
          grep -E -- '^-- sendspin-cli' configure.log

      - name: Build
        run: cmake --build build --parallel 3

      # As somebody other than root, which is what the container otherwise runs as. Three
      # StateStore cases assert that an unwritable directory is refused, and root is refused
      # nothing -- they fail as root for a reason that has nothing to do with the code under
      # test. The hosted legs never meet this because a runner is not root.
      - name: Test
        run: |
          useradd --create-home tester
          chown -R tester:tester .
          su tester -c 'ctest --test-dir build --output-on-failure'
