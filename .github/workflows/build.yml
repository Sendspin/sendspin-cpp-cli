name: Build

# The native-speed build matrix, shared by ci.yml and release.yml; no inputs, so both get the same legs.
# linux-armv6 is in build-armv6.yml.
on:
  workflow_call:

# Restated: called workflows inherit no defaults, and bash -e without pipefail would let | tee hide a failed configure.
permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Both hosted runner sizes used here have at least three cores.
  CMAKE_BUILD_PARALLEL_LEVEL: 3

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # Not sized for a build: bounds a player that ignores SIGTERM, with margin over the slowest leg.
    timeout-minutes: 20
    strategy:
      # Every leg's result, not just the first failure.
      fail-fast: false
      # Spell every key on every leg, false included: a missing key reads as false and silently disables that leg's work.
      # A publish: true leg also needs entries in both asset sets release.yml diffs (macOS: tarball and .pkg).
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            arm32: ''
            with_mdns: 'ON'
            with_portaudio: 'ON'
            with_pulse: 'ON'
            with_pipewire: 'ON'
            expect_probe: 'Failed'
            expect_backends: '^-- sendspin-cli audio backends: null, stdout, alsa, portaudio, pulse, pipewire$'
            expect_mdns: '^-- sendspin-cli mDNS: dns_sd \(.*libdns_sd\.so.*\)$'
            runtime_packages: 'libasound2t64 libportaudio2 libpulse0 libpipewire-0.3-0 libavahi-compat-libdnssd1'
            publish: true
            avahi: true
            systemd: true

          - name: linux-arm64
            runner: ubuntu-24.04-arm
            arm32: ''
            with_mdns: 'ON'
            with_portaudio: 'ON'
            with_pulse: 'ON'
            with_pipewire: 'ON'
            expect_probe: 'Failed'
            expect_backends: '^-- sendspin-cli audio backends: null, stdout, alsa, portaudio, pulse, pipewire$'
            expect_mdns: '^-- sendspin-cli mDNS: dns_sd \(.*libdns_sd\.so.*\)$'
            runtime_packages: 'libasound2t64 libportaudio2 libpulse0 libpipewire-0.3-0 libavahi-compat-libdnssd1'
            publish: true
            avahi: false
            systemd: true

          # Cross-compiled: no runner builds 32-bit ARM natively. expect_mdns pins the armhf path; runtime_packages use trixie names.
          - name: linux-armv7
            runner: ubuntu-24.04
            arm32: 'armv7'
            with_mdns: 'ON'
            with_portaudio: 'ON'
            with_pulse: 'ON'
            with_pipewire: 'ON'
            expect_probe: 'Failed'
            expect_backends: '^-- sendspin-cli audio backends: null, stdout, alsa, portaudio, pulse, pipewire$'
            expect_mdns: '^-- sendspin-cli mDNS: dns_sd \(/usr/lib/arm-linux-gnueabihf/libdns_sd\.so\)$'
            runtime_packages: 'libasound2t64 libportaudio2 libpulse0 libpipewire-0.3-0t64 libavahi-compat-libdnssd1'
            publish: true
            avahi: false
            systemd: false

          # Sound-server backends pinned off: brew could pull libpulse in without a commit.
          - name: macos-arm64
            runner: macos-14
            arm32: ''
            with_mdns: 'ON'
            with_portaudio: 'OFF'
            with_pulse: 'OFF'
            with_pipewire: 'OFF'
            expect_probe: 'Success'
            expect_backends: '^-- sendspin-cli audio backends: null, stdout, coreaudio$'
            expect_mdns: '^-- sendspin-cli mDNS: dns_sd \(Bonjour, built in\)$'
            runtime_packages: 'none. CoreAudio, AudioToolbox and Bonjour are all part of macOS.'
            publish: true
            avahi: false
            systemd: false

          # Compiles mdns_null.cpp and the no-Pulse/PipeWire test arms, which no other leg does.
          - name: linux-x86_64-nomdns
            runner: ubuntu-24.04
            arm32: ''
            with_mdns: 'OFF'
            with_portaudio: 'ON'
            with_pulse: 'OFF'
            with_pipewire: 'OFF'
            expect_backends: '^-- sendspin-cli audio backends: null, stdout, alsa, portaudio$'
            expect_mdns: '^-- sendspin-cli mDNS: none$'
            publish: false
            avahi: false
            systemd: true

    steps:
      # Actions pinned to commits; the trailing comment is the version.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux' && !matrix.arm32
        run: |
          sudo apt-get update
          # pkg-config finds PortAudio, so name it even though the image has it.
          sudo apt-get install --no-install-recommends -y \
            pkg-config \
            libasound2-dev \
            portaudio19-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libavahi-compat-libdnssd-dev

      # Instead of the step above, so no host-arch -dev library can answer find_library.
      - name: Install the cross toolchain and armhf dependencies (cross-compiled 32-bit ARM)
        if: matrix.arm32
        run: |
          sudo dpkg --add-architecture armhf

          # Read off the runner, so a newer image cannot mix this release's armhf packages with its toolchain.
          host_arch="$(dpkg --print-architecture)"
          . /etc/os-release
          [ -n "${VERSION_CODENAME:-}" ] || {
            echo '::error::/etc/os-release names no VERSION_CODENAME, so there is no suite to point the armhf source at'
            exit 1
          }
          echo "Cross-building on $host_arch/$VERSION_CODENAME."

          # armhf lives on ports.ubuntu.com: pin existing sources to the host arch and add one for armhf.
          sources=/etc/apt/sources.list.d/ubuntu.sources
          [ -f "$sources" ] || {
            echo "::error::this image has no $sources; its apt layout has changed and the armhf constraint below no longer lands anywhere"
            exit 1
          }

          # Constrain each deb822 stanza unless it already names architectures.
          for f in /etc/apt/sources.list.d/*.sources; do
            [ -e "$f" ] || continue
            grep -q '^Architectures:' "$f" ||
              sudo sed -i "/^Types:/a Architectures: $host_arch" "$f"
          done

          # One-line sources: skip only entries that already name an architecture, not any bracket.
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
            [ -e "$f" ] || continue
            sudo sed -i -E \
              -e "/^deb(-src)? .*arch=/! s|^(deb(-src)?) \[|\1 [arch=$host_arch |" \
              -e "/^deb(-src)? .*arch=/! s|^(deb(-src)?) ([^[])|\1 [arch=$host_arch] \3|" \
              "$f"
          done

          sudo tee /etc/apt/sources.list.d/ubuntu-ports-armhf.sources >/dev/null <<SOURCES
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: $VERSION_CODENAME $VERSION_CODENAME-updates $VERSION_CODENAME-backports $VERSION_CODENAME-security
          Components: main restricted universe multiverse
          Architectures: armhf
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES

          echo 'What apt will read:'
          cat /etc/apt/sources.list.d/*.sources
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
            [ -e "$f" ] || continue
            printf '%s:\n' "$f"
            cat "$f"
          done

          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            crossbuild-essential-armhf \
            qemu-user-static \
            pkg-config \
            libasound2-dev:armhf \
            portaudio19-dev:armhf \
            libpulse-dev:armhf \
            libpipewire-0.3-dev:armhf \
            libavahi-compat-libdnssd-dev:armhf

          # qemu-user-static ships binfmt drop-ins; this registers them.
          sudo systemctl restart systemd-binfmt

          # gtest discovery and the version read execute ARM binaries at build time, so prove binfmt works.
          printf 'int main(void) { return 0; }\n' >binfmt-probe.c
          arm-linux-gnueabihf-gcc -o binfmt-probe binfmt-probe.c
          ./binfmt-probe || {
            echo '::error::this kernel will not execute a 32-bit ARM binary -- qemu-arm is not registered, so nothing below can run what it builds'
            systemctl status systemd-binfmt --no-pager --full || true
            ls /proc/sys/fs/binfmt_misc || true
            exit 1
          }
          echo 'A 32-bit ARM binary runs on this host.'
          rm -f binfmt-probe binfmt-probe.c

      # Fetched sources and subbuild stamps only, never build outputs; keyed per leg and by CMakeLists.txt.
      - name: Cache the fetched sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .deps/*-src
            .deps/*-subbuild
          key: deps-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        env:
          WITH_MDNS: ${{ matrix.with_mdns }}
          WITH_PORTAUDIO: ${{ matrix.with_portaudio }}
          WITH_PULSE: ${{ matrix.with_pulse }}
          WITH_PIPEWIRE: ${{ matrix.with_pipewire }}
          DEPS_DIR: ${{ github.workspace }}/.deps
          ARM32: ${{ matrix.arm32 }}
        run: |
          # Shared by both configure paths; build-armv6.yml has a third copy to keep in step.
          options=(
            -DCMAKE_BUILD_TYPE=Release
            -DSENDSPIN_CLI_WERROR=ON
            -DSENDSPIN_CLI_WITH_MDNS="$WITH_MDNS"
            -DSENDSPIN_CLI_WITH_PORTAUDIO="$WITH_PORTAUDIO"
            -DSENDSPIN_CLI_WITH_PULSE="$WITH_PULSE"
            -DSENDSPIN_CLI_WITH_PIPEWIRE="$WITH_PIPEWIRE"
            -DFETCHCONTENT_BASE_DIR="$DEPS_DIR"
          )

          if [ -n "$ARM32" ]; then
            scripts/build_arm32.sh "$ARM32" build "${options[@]}" 2>&1 | tee configure.log
          else
            cmake -B build "${options[@]}" 2>&1 | tee configure.log
          fi

      # Backends are optional, so assert each was found, with anchored whole-line matches.
      - name: Assert the configure output found what this leg expects
        env:
          EXPECT_BACKENDS: ${{ matrix.expect_backends }}
          EXPECT_MDNS: ${{ matrix.expect_mdns }}
          EXPECT_PROBE: ${{ matrix.expect_probe }}
        run: |
          patterns=("$EXPECT_BACKENDS" "$EXPECT_MDNS")

          # Probes fail open, so pin them; skipped on no-mDNS legs since an empty ERE matches anything.
          if [ -n "$EXPECT_PROBE" ]; then
            for symbol in SERVICE_NOT_RUNNING TIMEOUT; do
              patterns+=("^-- Performing Test SENDSPIN_CLI_HAVE_ERR_$symbol - $EXPECT_PROBE\$")
            done
          fi

          status=0
          for expected in "${patterns[@]}"; do
            if ! grep -Eq -e "$expected" configure.log; then
              echo "::error::configure output has no line matching: $expected"
              status=1
            fi
          done
          echo 'What configure actually reported:'
          grep -E -- '^-- (sendspin-cli|Performing Test SENDSPIN_CLI)' configure.log ||
            echo '(configure.log has no sendspin-cli lines at all)'
          exit "$status"

      - name: Build
        run: cmake --build build

      # Read the target architecture off the linked binary, which covers every dependency, before running the suite.
      - name: Assert the binary is built for the architecture this leg claims
        if: matrix.arm32
        env:
          ARM32: ${{ matrix.arm32 }}
        run: |
          binary=build/sendspin-cli

          case "$ARM32" in
            armv7) want_arch='v7' ;;
            *)
              echo "::error::no expected CPU architecture is recorded here for '$ARM32'"
              exit 1
              ;;
          esac

          # Into files first: grep -q on a pipe can SIGPIPE the writer under pipefail.
          readelf -h "$binary" >elf-header.txt
          readelf -A "$binary" >elf-attributes.txt
          echo 'What the linked binary reports:'
          file "$binary"
          cat elf-header.txt elf-attributes.txt

          field() {
            sed -n "/^[[:space:]]*$1:/ { s/^[[:space:]]*$1:[[:space:]]*//p; q; }" "$2"
          }

          status=0
          expect() {
            [ "$2" = "$3" ] || {
              echo "::error::$1 is '$2', not '$3'"
              status=1
            }
          }

          expect 'the ELF class' "$(field Class elf-header.txt)" 'ELF32'
          expect 'the ELF machine' "$(field Machine elf-header.txt)" 'ARM'
          expect 'Tag_CPU_arch' "$(field Tag_CPU_arch elf-attributes.txt)" "$want_arch"
          # Hard-float calling convention, from the attribute rather than the flag.
          expect 'Tag_ABI_VFP_args' "$(field Tag_ABI_VFP_args elf-attributes.txt)" 'VFP registers'

          # Substring match: the flags line carries unrelated bits.
          flags="$(field Flags elf-header.txt)"
          case "$flags" in
            *'hard-float ABI'*) ;;
            *)
              echo "::error::the ELF header flags are '$flags', which do not declare the hard-float EABI"
              status=1
              ;;
          esac

          rm -f elf-header.txt elf-attributes.txt
          exit "$status"

      # Every leg, no-mDNS included. Serial: flock and filesystem tests are not parallel-safe.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Before avahi-daemon is installed, to exercise the non-fatal advertise-failure path.
      - name: Smoke test
        if: matrix.publish
        run: scripts/smoke_test.sh build/sendspin-cli

      # Proves libavahi-compat-libdnssd implements our dns_sd calls: register, browse, resolve, QueryRecord.
      - name: Advertise and discover through a real Avahi daemon
        if: matrix.avahi
        run: |
          sudo apt-get install --no-install-recommends -y avahi-daemon avahi-utils
          sudo systemctl start avahi-daemon

          # Wait for the avahi socket before starting the player.
          for _ in $(seq 1 200); do
            if [ -S /run/avahi-daemon/socket ]; then break; fi
            sleep 0.1
          done
          [ -S /run/avahi-daemon/socket ] || {
            echo '::error::avahi-daemon was started but its socket never appeared'
            systemctl status avahi-daemon --no-pager || true
            exit 1
          }

          instance="sendspin-ci-$GITHUB_RUN_ID"

          # Half one: our advertisement, browsed back and resolved to an address.
          ./build/sendspin-cli -o null --port 39301 --mdns-name "$instance" >advertise.log 2>&1 &
          player=$!
          trap 'kill -TERM "$player" 2>/dev/null || true' EXIT

          for _ in $(seq 1 200); do
            if grep -q 'advertising _sendspin\._tcp' advertise.log; then break; fi
            sleep 0.1
          done
          grep -q 'advertising _sendspin\._tcp' advertise.log || {
            echo '::error::the player never registered its advertisement'
            cat advertise.log
            exit 1
          }

          # Parseable output: address in field 8, port in field 9.
          avahi-browse -rpt _sendspin._tcp >browse.txt
          echo 'What avahi-browse resolved:'
          cat browse.txt
          awk -F';' -v want="$instance" '
            $1 == "=" && $4 == want && $8 != "" && $9 == "39301" { found = 1 }
            END { exit found ? 0 : 1 }
          ' browse.txt || {
            echo "::error::$instance was not browsable with a resolved address on port 39301"
            exit 1
          }

          # Everything is proven by now, so a player that already exited must not fail the leg.
          kill -TERM "$player" 2>/dev/null || true
          wait "$player" 2>/dev/null || true
          trap - EXIT

          # Half two: a published server discovered by our code; a built ws:// URL proves QueryRecord answered.
          avahi-publish -s "$instance-server" _sendspin-server._tcp 8927 \
            'path=/sendspin' "name=$instance-server" &
          publisher=$!
          trap 'kill -TERM "$publisher" 2>/dev/null || true' EXIT

          ./build/sendspin-cli -o null --port 39302 -s "mdns:$instance-server" \
            >discover.log 2>&1 &
          client=$!
          trap 'kill -TERM "$client" "$publisher" 2>/dev/null || true' EXIT

          resolved="found server \"$instance-server\" .* at ws://"
          for _ in $(seq 1 300); do
            if grep -q "$resolved" discover.log; then break; fi
            sleep 0.1
          done
          echo 'What the discovering client logged:'
          cat discover.log
          grep -q "$resolved" discover.log || {
            echo '::error::the server was published but never resolved to a ws:// URL'
            exit 1
          }

          kill -TERM "$client" "$publisher" 2>/dev/null || true

      # DESTDIR (not --prefix) keeps ExecStart valid; --component keeps it ours; tarred to keep +x.
      - name: Package
        if: matrix.publish
        id: package
        env:
          RUNTIME_PACKAGES: ${{ matrix.runtime_packages }}
          LEG: ${{ matrix.name }}
          ARM32: ${{ matrix.arm32 }}
        run: |
          reported="$(./build/sendspin-cli --version)"
          version="$(printf '%s\n' "$reported" | awk 'NR == 1 { print $2 }')"
          lib_tag="$(printf '%s\n' "$reported" | awk 'NR == 2 { print $2 }')"
          name="sendspin-cli-$version-$LEG"

          mkdir -p "stage/$name"
          DESTDIR="$PWD/stage/$name" cmake --install build --component sendspin-cli

          cat >"stage/$name/BUILD-INFO.txt" <<INFO
          sendspin-cli $version for $LEG
          Built from commit $GITHUB_SHA on $RUNNER_OS/$RUNNER_ARCH
          Linked against sendspin-cpp $lib_tag

          Runtime packages this binary needs:
            $RUNTIME_PACKAGES

          Every path under usr/ here is where the file installs to, so it goes in with one
          command from the directory holding the tarball:

            sudo tar -xzf $name.tar.gz --strip-components=1 -C / $name/usr

          Naming $name/usr is what leaves this file behind rather than unpacking it at /.

          Or run it where you unpacked it: ./$name/usr/local/bin/sendspin-cli --help

          This build is configured for the /usr/local prefix, which is why those paths are
          what they are.
          INFO

          # Gatekeeper advice travels inside the macOS archive.
          if [ "$RUNNER_OS" = 'macOS' ]; then
            cat >>"stage/$name/BUILD-INFO.txt" <<MACOS

          This binary is ad-hoc signed -- the minimum arm64 needs to run at all -- so it
          carries no developer identity and Gatekeeper has nothing to check it against.
          Unpack with \`tar -xzf\` from a terminal, which does not propagate the quarantine
          flag where Finder's Archive Utility does. If macOS refuses it anyway:

            xattr -d com.apple.quarantine ./$name/usr/local/bin/sendspin-cli

          There is an installer .pkg beside this tarball in the same build, and on every
          release, holding the same files. It is unsigned too, and it is not the Gatekeeper
          fix -- what it fixes is that \`installer\` makes no assessment at all, and that it
          is the shape a notarization ticket can later be stapled to. A Developer ID
          signature and notarization are still owed; see README.md.
          MACOS
          else
            cat >>"stage/$name/BUILD-INFO.txt" <<'LINUX'

          The systemd unit is at usr/local/lib/systemd/system/sendspin-cli.service, which is
          on systemd's own search path, so installing as above needs no copying. The one
          command a tarball cannot run for itself creates the account the unit runs as,
          declared beside it in usr/local/lib/sysusers.d/sendspin-cli.conf:

            sudo systemd-sysusers
            sudo systemctl daemon-reload
            sudo systemctl enable --now sendspin-cli

          Skip the first line and the unit will not start: systemctl reports 217/USER.

          It runs the player as an unprivileged sendspin-cli user, in the foreground, with its
          state in /var/lib/sendspin-cli and its control socket in /run/sendspin-cli. An
          existing /var/lib/sendspin-cli left behind by an earlier root-run version needs
          nothing done to it -- systemd chowns it. Configure it in
          /etc/sendspin-cli.conf; there is an annotated example beside the installed README,
          under usr/local/share/doc/sendspin-cli. Its ExecStart names /usr/local/bin/sendspin-cli
          absolutely, so a binary put anywhere else needs the unit changed to match.
          LINUX
          fi

          # Explains the build-host line for cross-built archives.
          if [ -n "$ARM32" ]; then
            cat >>"stage/$name/BUILD-INFO.txt" <<CROSS

          This is a cross build. It was compiled for $ARM32 on the runner named above, and its
          unit suite and smoke test were run there under qemu-user rather than on a Raspberry
          Pi -- so what is proven is that the code builds and behaves, not that it was tried on
          the hardware. The build attributes of the binary are asserted to be $ARM32,
          hard-float EABI, before this archive is made.

          It is built for Raspberry Pi OS trixie, and the runtime packages above are spelled
          the way trixie spells them. On bookworm they are libasound2 and libpipewire-0.3-0,
          without the t64 -- but that is the smaller problem: this binary needs glibc 2.38 and
          bookworm has 2.36, so its loader refuses it outright with "version \`GLIBC_2.38' not
          found". Move that Pi to trixie, or build from source on it.
          CROSS
          fi

          tar -czf "$name.tar.gz" -C stage "$name"
          echo "name=$name" >>"$GITHUB_OUTPUT"
          # Passed on so the installer step does not read the version again.
          echo "version=$version" >>"$GITHUB_OUTPUT"

      # Assert the exact payload; keep in step with build-armv6.yml's list of the same.
      - name: Assert the payload holds exactly what it should
        if: matrix.publish
        env:
          NAME: ${{ steps.package.outputs.name }}
        run: |
          expected=$(mktemp)
          {
            echo BUILD-INFO.txt
            echo usr/local/bin/sendspin-cli
            echo usr/local/share/doc/sendspin-cli/LICENSE
            echo usr/local/share/doc/sendspin-cli/README.md
            echo usr/local/share/doc/sendspin-cli/contributors.md
            echo usr/local/share/doc/sendspin-cli/sendspin-cli.conf.example
            if [ "$RUNNER_OS" = 'Linux' ]; then
              echo usr/local/lib/sysusers.d/sendspin-cli.conf
              echo usr/local/lib/systemd/system/sendspin-cli.service
            fi
          } | sort >"$expected"

          # `! -type d` so symlinks count.
          actual=$(mktemp)
          (cd "stage/$NAME" && find . ! -type d | sed 's|^\./||') | sort >"$actual"

          echo 'What the payload holds:'
          cat "$actual"
          diff -u "$expected" "$actual" || {
            echo '::error::the staged payload is not the file list this workflow expects'
            exit 1
          }

          # Again from the shipped tarball, with the executable bit; directory entries dropped first.
          tar -tzf "$NAME.tar.gz" | grep -v '/$' | sed -n "s|^$NAME/||p" | sort >"$actual"
          diff -u "$expected" "$actual" || {
            echo '::error::the tarball does not hold what the staged payload does'
            exit 1
          }
          [ -x "stage/$NAME/usr/local/bin/sendspin-cli" ] || {
            echo '::error::the staged sendspin-cli is not executable'
            exit 1
          }

      # What would have caught the dyld abort: a Homebrew load command is a dependency no clean
      # Mac has, and CI never sees it because the runner installed it.
      - name: Assert the macOS binary loads nothing that is not part of macOS
        if: matrix.publish && runner.os == 'macOS'
        env:
          NAME: ${{ steps.package.outputs.name }}
        run: |
          binary="stage/$NAME/usr/local/bin/sendspin-cli"
          echo 'What the staged binary loads:'
          otool -L "$binary"

          # Each dependency is a tab-indented line whose first field is the install name; the
          # header line naming the binary itself is not indented.
          otool -L "$binary" | sed -n 's|^\t\([^ ]*\).*|\1|p' >load-commands.txt

          status=0
          while read -r path; do
            case "$path" in
              /usr/lib/*|/System/Library/Frameworks/*|/System/Library/PrivateFrameworks/*) ;;
              *)
                echo "::error::the binary loads $path, which is not part of macOS -- a Mac without it aborts at launch"
                status=1
                ;;
            esac
          done <load-commands.txt

          rm -f load-commands.txt
          exit "$status"

      # Install at the real prefix and verify the unit (not on cross legs: MemoryDenyWriteExecute= forbids qemu-user).
      # After Package, or a root-owned install manifest in build/ breaks the unprivileged staging install.
      - name: Install at the real prefix and verify the systemd unit
        if: matrix.systemd
        run: |
          sudo cmake --install build --component sendspin-cli
          unit=/usr/local/lib/systemd/system/sendspin-cli.service
          [ -f "$unit" ] || {
            echo "::error::the install put no unit at $unit"
            exit 1
          }
          echo "What was installed as $unit:"
          cat "$unit"
          systemd-analyze verify "$unit"

      # Run the hardened unit as its account on a real systemd runner, via the same systemd-sysusers step as README.
      - name: Run the unit as its own user, with the hardening block
        if: matrix.systemd
        env:
          AVAHI: ${{ matrix.avahi }}
        run: |
          # Defined first so every failure below prints the journal.
          fail() {
            echo "::error::$1"
            systemctl status sendspin-cli --no-pager --full || true
            journalctl -u sendspin-cli --no-pager | tail -40 || true
            exit 1
          }

          sudo systemd-sysusers
          id sendspin-cli
          # case, not a pipe into grep -q, which pipefail would report as failure.
          case " $(id -nG sendspin-cli) " in
            *' audio '*) ;;
            *)
              echo '::error::the sysusers fragment did not put sendspin-cli in the audio group'
              exit 1
              ;;
          esac

          # No card on a runner, so the config picks null.
          printf '%s\n' 'output = null' | sudo tee /etc/sendspin-cli.conf >/dev/null

          # Plant a root-owned state dir: StateDirectory= must take it over.
          sock=/run/sendspin-cli/control.sock
          sudo rm -rf /var/lib/sendspin-cli
          sudo install -d -m 0700 /var/lib/sendspin-cli
          printf '%s\n' '# Written by sendspin-cli. Edits are overwritten.' \
            'static-delay-ms = 175' | sudo tee /var/lib/sendspin-cli/state >/dev/null
          sudo chmod 0600 /var/lib/sendspin-cli/state

          sudo systemctl daemon-reload
          sudo systemctl start sendspin-cli || fail 'systemctl start refused the unit'
          for _ in $(seq 1 100); do [ -S "$sock" ] && break; sleep 0.2; done

          [ "$(systemctl is-active sendspin-cli)" = active ] || fail 'the unit did not start'

          # Numeric uids: ps truncates long user names.
          main=$(systemctl show -p MainPID --value sendspin-cli)
          [ "$main" != 0 ] || fail 'the unit reports no main process'
          owner=$(ps -o uid= -p "$main" | tr -d ' ') || fail "no process with pid $main"
          [ "$owner" = "$(id -u sendspin-cli)" ] ||
            fail "the player runs as uid $owner, not sendspin-cli ($(id -u sendspin-cli))"

          status=$(sudo sendspin-cli status --control-socket "$sock") ||
            fail 'the control socket did not answer status'
          printf '%s\n' "$status"

          # 175 came from the planted root-owned file, so the directory was handed over intact.
          case "$status" in
            *'static delay: 175 ms'*) ;;
            *) fail 'the state left by a root-run player did not survive the ownership change' ;;
          esac

          sudo sendspin-cli delay 250 --control-socket "$sock" || fail 'delay was refused'
          for _ in $(seq 1 50); do
            [ "$(stat -c '%U %a' /var/lib/sendspin-cli/state 2>/dev/null)" = 'sendspin-cli 600' ] &&
              break
            sleep 0.2
          done
          state=$(stat -c '%U %a' /var/lib/sendspin-cli/state 2>/dev/null)
          [ "$state" = 'sendspin-cli 600' ] || fail "the state file is '$state', not 'sendspin-cli 600'"

          # This invocation only, so an earlier run's lines cannot pass the gate.
          invocation=$(systemctl show -p InvocationID --value sendspin-cli)
          [ -n "$invocation" ] || fail 'the unit reports no invocation id to scope the journal to'

          # A WebSocket handshake triggers client/hello; its client_id needs getifaddrs(), i.e. AF_NETLINK.
          python3 - <<'EOF' || fail 'the hardened unit did not greet a connection with a non-empty client_id'
          import base64, json, os, socket, sys, time

          # The control socket appearing says nothing about the WebSocket port, so the connect
          # is retried rather than assumed.
          deadline = time.monotonic() + 20
          while True:
              try:
                  sock = socket.create_connection(("127.0.0.1", 8928), timeout=5)
                  break
              except OSError as err:
                  if time.monotonic() > deadline:
                      sys.exit(f"nothing accepted a connection on port 8928: {err}")
                  time.sleep(0.2)
          sock.settimeout(10)

          buffered = b""

          def read(count):
              global buffered
              while len(buffered) < count:
                  chunk = sock.recv(65536)
                  if not chunk:
                      sys.exit("the player closed the connection before sending client/hello")
                  buffered += chunk
              out, buffered = buffered[:count], buffered[count:]
              return out

          key = base64.b64encode(os.urandom(16)).decode()
          sock.sendall(
              "GET /sendspin HTTP/1.1\r\nHost: 127.0.0.1:8928\r\nUpgrade: websocket\r\n"
              f"Connection: Upgrade\r\nSec-WebSocket-Key: {key}\r\nSec-WebSocket-Version: 13\r\n\r\n"
              .encode()
          )
          response = b""
          while not response.endswith(b"\r\n\r\n"):
              response += read(1)
          status = response.split(b"\r\n", 1)[0].decode(errors="replace")
          if status.split()[1:2] != ["101"]:
              sys.exit(f"the WebSocket upgrade was refused: {status}")

          # The first complete text message. Frames from a server are unmasked; control and
          # binary frames are skipped rather than mistaken for it.
          message = b""
          while True:
              first, second = read(2)
              length = second & 0x7F
              if length == 126:
                  length = int.from_bytes(read(2), "big")
              elif length == 127:
                  length = int.from_bytes(read(8), "big")
              payload = read(length)
              opcode = first & 0x0F
              if opcode == 0x8:
                  sys.exit("the player sent a close frame before client/hello")
              if opcode in (0x0, 0x1):
                  message += payload
                  if first & 0x80:
                      break

          hello = json.loads(message)
          if hello.get("type") != "client/hello":
              sys.exit(f"the first message was {hello.get('type')!r}, not client/hello")
          client_id = hello.get("payload", {}).get("client_id")
          if not client_id:
              sys.exit("client/hello carried an empty client_id")
          print(f"client/hello carried client_id {client_id}")
          EOF

          # --sync so the grep sees every line logged so far.
          sudo journalctl --sync
          journalctl "_SYSTEMD_INVOCATION_ID=$invocation" --no-pager >journal.log
          grep -q 'listening on port 8928' journal.log ||
            fail "this invocation's journal is missing the player's startup line, so its silence proves nothing"
          if grep -q 'getifaddrs failed' journal.log; then
            fail 'getifaddrs() failed under the hardening block, so the client id was not MAC-derived'
          fi

          # Only with a real avahi-daemon: RestrictAddressFamilies= must still allow AF_UNIX to it.
          if [ "$AVAHI" = 'true' ]; then
            for _ in $(seq 1 100); do
              journalctl "_SYSTEMD_INVOCATION_ID=$invocation" --no-pager >journal.log
              if grep -q 'mdns: advertising _sendspin\._tcp' journal.log; then break; fi
              sleep 0.2
            done
            grep -q 'mdns: advertising _sendspin\._tcp' journal.log ||
              fail 'the mDNS advertisement never reached avahi-daemon under the hardening block'
          fi

          sudo systemctl restart sendspin-cli || fail 'the unit would not restart'
          for _ in $(seq 1 100); do [ -S "$sock" ] && break; sleep 0.2; done
          status=$(sudo sendspin-cli status --control-socket "$sock") ||
            fail 'the control socket did not answer status after a restart'
          case "$status" in
            *'static delay: 250 ms'*) ;;
            *) fail 'the 250 ms set over the socket did not survive a restart' ;;
          esac

          # Restart=on-failure: a new MainPID after RestartSec proves the restart.
          main=$(systemctl show -p MainPID --value sendspin-cli)
          sudo kill -9 "$main"
          for _ in $(seq 1 100); do
            now=$(systemctl show -p MainPID --value sendspin-cli)
            [ "$now" != "$main" ] && [ "$now" != 0 ] &&
              [ "$(systemctl is-active sendspin-cli)" = active ] && break
            sleep 0.2
          done
          [ "$(systemctl is-active sendspin-cli)" = active ] &&
            [ "$(systemctl show -p MainPID --value sendspin-cli)" != "$main" ] ||
            fail 'the unit did not come back after SIGKILL'

          sudo systemctl stop sendspin-cli
          result=$(systemctl show -p Result --value sendspin-cli)
          [ "$result" = success ] || fail "stopping the unit left Result=$result"

          # Printed, not asserted.
          systemd-analyze security sendspin-cli --no-pager || true

      # macOS installer from the staged payload; here so release.yml ships it too.
      - name: Build the macOS installer .pkg
        if: matrix.publish && runner.os == 'macOS'
        env:
          NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: scripts/build_macos_pkg.sh "stage/$NAME" "$VERSION" "$NAME.pkg"

      # Install the .pkg at / and check its receipt, --version and the smoke suite against it.
      # pkgutil --files is relative to /usr/local; the `._` filter guards against AppleDouble members.
      - name: Install the .pkg and verify what it put on disk
        if: matrix.publish && runner.os == 'macOS'
        env:
          NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
          # Spelled out independently of the script: changing it orphans existing receipts.
          IDENTIFIER: io.github.chrisuthe.sendspin-cli
        run: |
          sudo installer -pkg "$NAME.pkg" -target /

          echo 'What the receipt says was installed:'
          pkgutil --pkg-info "$IDENTIFIER"

          # Read back off the receipt to prove the threaded version arrived.
          info="$(pkgutil --pkg-info "$IDENTIFIER")"
          version="$(printf '%s\n' "$info" | sed -n 's|^version: ||p')"
          [ "$version" = "$VERSION" ] || {
            echo "::error::the receipt names version '$version', not '$VERSION'"
            exit 1
          }

          # Trim slashes: pkgutil prints the location relative and with a trailing slash.
          location="$(printf '%s\n' "$info" | sed -n 's|^location: ||p' | sed 's|^/*||; s|/*$||')"
          [ "$location" = 'usr/local' ] || {
            echo "::error::the receipt installs into '$location', not usr/local"
            exit 1
          }

          expected=$(mktemp)
          {
            echo bin/sendspin-cli
            echo share/doc/sendspin-cli/LICENSE
            echo share/doc/sendspin-cli/README.md
            echo share/doc/sendspin-cli/contributors.md
            echo share/doc/sendspin-cli/sendspin-cli.conf.example
          } | sort >"$expected"

          # Printed raw before the filter, so a difference is explainable.
          echo 'What the receipt lists, unfiltered:'
          pkgutil --files "$IDENTIFIER"

          actual=$(mktemp)
          pkgutil --files "$IDENTIFIER" --only-files | grep -Ev '(^|/)\._' | sort >"$actual"

          echo 'What the installed package holds:'
          cat "$actual"
          diff -u "$expected" "$actual" || {
            echo '::error::the installed .pkg is not the file list this workflow expects'
            exit 1
          }
          [ -x /usr/local/bin/sendspin-cli ] || {
            echo '::error::the installed sendspin-cli is not executable'
            exit 1
          }

          /usr/local/bin/sendspin-cli --version
          scripts/smoke_test.sh /usr/local/bin/sendspin-cli

      - name: Upload
        if: matrix.publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.tar.gz
          # Long enough to bisect; releases take their own copy.
          retention-days: 14
          if-no-files-found: error

      # A separate step: if-no-files-found: error would fail Linux legs, and artifact names must differ.
      - name: Upload the macOS installer
        if: matrix.publish && runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}-installer
          path: ${{ steps.package.outputs.name }}.pkg
          retention-days: 14
          if-no-files-found: error

  # Not a matrix leg: it publishes nothing, and runs in a container rather than on a hosted image.
  pipewire-minimum:
    name: linux-x86_64-pipewire-min
    runs-on: ubuntu-24.04
    # Debian 12 ships libpipewire 0.3.65, the declared minimum; hosted images only have 1.x.
    container: debian:12
    timeout-minutes: 30
    steps:
      # Before checkout, as root: the image lacks git and CA certificates.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y             build-essential             cmake             git             ca-certificates             pkg-config             libasound2-dev             libpulse-dev             libpipewire-0.3-dev

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Fail if the image stops shipping an 0.3 libpipewire at or above the minimum.
      - name: Assert this image still ships the minimum
        run: |
          version=$(pkg-config --modversion libpipewire-0.3)
          minimum=$(grep -oE 'SENDSPIN_CLI_PIPEWIRE_MIN_VERSION [0-9.]+' CMakeLists.txt | awk '{print $2}')
          echo "libpipewire $version, against a declared minimum of $minimum"
          if ! pkg-config --atleast-version="$minimum" libpipewire-0.3; then
            echo "::error::libpipewire $version is below the declared minimum $minimum"
            exit 1
          fi
          if ! pkg-config --max-version=0.3.999 libpipewire-0.3; then
            echo "::error::libpipewire $version is no longer an 0.3 release, so this job has stopped testing the floor it is named for -- repoint it at an image that still ships one, or lower SENDSPIN_CLI_PIPEWIRE_MIN_VERSION deliberately"
            exit 1
          fi

      # No SENDSPIN_CLI_WERROR: gcc 12's -Wrestrict false positive is not what this job tests.
      - name: Configure
        run: |
          cmake -B build             -DCMAKE_BUILD_TYPE=Release             -DSENDSPIN_CLI_WITH_PORTAUDIO=OFF             -DSENDSPIN_CLI_WITH_MDNS=OFF             2>&1 | tee configure.log

      # Without PipeWire found, this job would prove nothing.
      - name: Assert the configure output found PipeWire
        run: |
          expected='^-- sendspin-cli audio backends: null, stdout, alsa, pulse, pipewire$'
          if ! grep -Eq -e "$expected" configure.log; then
            echo "::error::configure output has no line matching: $expected"
            grep -E -- '^-- sendspin-cli' configure.log ||
              echo '(configure.log has no sendspin-cli lines at all)'
            exit 1
          fi
          grep -E -- '^-- sendspin-cli' configure.log

      - name: Build
        run: cmake --build build --parallel 3

      # As non-root: StateStore tests fail as root.
      - name: Test
        run: |
          useradd --create-home tester
          chown -R tester:tester .
          su tester -c 'ctest --test-dir build --output-on-failure'
