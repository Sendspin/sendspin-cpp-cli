name: Release

# A human tags; this publishes what that tag builds. Nothing here creates a tag, and there is
# no second trigger -- no branch push, no pull request, no schedule, no `workflow_dispatch` --
# so the only way to reach `gh release create` is to have pushed a `v*` tag. `ci.yml` filters on
# branches and so never fires for a tag, leaving one workflow to answer for one tag.
on:
  push:
    tags:
      - 'v*'

# Deliberately no `concurrency` block, where ci.yml has one. Its `cancel-in-progress: true`
# would be free to cancel this run midway through uploading assets, which is the exact partial
# state the release below is arranged to make impossible. A superseded tag push is not a thing
# that happens anyway: a tag is pushed once.

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Ahead of the matrix, and its whole value is that it costs seconds: a mistyped tag must not
  # burn three runners for half an hour before anyone finds out. What it checks is cheap to
  # check without building -- the tag's shape, and the version the source says it will report.
  #
  # This duplicates part of what `Assert the release is complete` re-checks later against the
  # built archives, and the duplication is deliberate in the way ci.yml's payload assertions are:
  # the later check is the authoritative one, because it reads names the *binary* produced, and
  # this one is an early mirror of the single likeliest human error. If they ever disagree,
  # the later one is right.
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check the tag names the version this source reports
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The `v*` trigger also matches v0.2.0-rc1, which would be published as `latest` with
          # no --prerelease and no one having decided that. Refused here rather than handled:
          # whoever first wants a prerelease can decide what it means then.
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH; this workflow publishes releases only"
            exit 1
          }

          # CMakeLists.txt's project(VERSION) is what becomes SENDSPIN_CLI_VERSION and so what
          # `--version` prints, and it is a hand-edited line bumped in a PR before the tag is
          # pushed -- not derived from git. Deriving it would tie the version to the presence of
          # a .git directory and put the tag into the deps cache key; checking beats deriving.
          #
          # Counted rather than read first-match-wins, which is what catches a second VERSION
          # line appearing somewhere in the file: taking the first would silently pick between
          # them. `|| true` because `grep -c` exits 1 when the count is zero, and this shell runs
          # under `-e` -- without it the step dies on the assignment and the message below, the
          # one that says what is actually wrong, never prints.
          pattern='^[[:space:]]*VERSION [0-9]+\.[0-9]+\.[0-9]+$'
          matches="$(grep -cE "$pattern" CMakeLists.txt || true)"
          [ "$matches" = 1 ] || {
            echo "::error::expected exactly one VERSION line in CMakeLists.txt, found $matches"
            exit 1
          }
          version="$(grep -E "$pattern" CMakeLists.txt | awk '{print $2}')"

          echo "tag $TAG, CMakeLists.txt VERSION $version"
          [ "$TAG" = "v$version" ] || {
            echo "::error::tag $TAG does not match CMakeLists.txt VERSION $version -- bump one to match the other"
            exit 1
          }
          echo "version=$version" >>"$GITHUB_OUTPUT"

      # The second likeliest way to reach this workflow with nothing publishable at the end of
      # it: a tag that something already claims. `gh release create` will not refuse it -- a
      # draft is not bound to a tag ref, so it is free to add a second one alongside whatever is
      # there -- and the release job would then publish a release for a tag that already has
      # one. Refused here for the same reason the version check is here: seconds, not half an
      # hour of runners, and the answer does not need a build to find.
      - name: Refuse a tag that already carries a release
        env:
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Listed and filtered rather than asked via `releases/tags/$TAG`, which is the endpoint
          # that caused the bug this guard accompanies: it resolves a *tag* to a release, so a
          # miss and an error both surface as one failed lookup, and reading that as "nothing is
          # there" is what fails open. Listing puts an API error on the step's own exit status.
          #
          # Whether drafts appear here depends on the token: GitHub returns them only to push
          # access, and this job runs under the workflow's read-only default. That is the right
          # split. A stale draft is litter -- the release job now names the draft it created, so
          # an older one is ignored rather than published -- while a release already published
          # against this tag is the state that has to stop the run, and that one is always
          # visible.
          existing="$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq '.[] | select(.tag_name == env.TAG) | "  \(.html_url)  draft=\(.draft)  assets=\(.assets | length)"')"
          [ -z "$existing" ] || {
            echo "$existing"
            echo "::error::$TAG already has a release; delete it before re-cutting this tag"
            exit 1
          }
          echo "no release claims $TAG yet"

  # The same build ci.yml runs, matrix and assertions and all. `needs: preflight` is what keeps
  # a bad tag from starting it.
  build:
    needs: preflight
    uses: ./.github/workflows/build.yml

  release:
    name: release
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Scoped to this job alone, the workflow default above staying read-only. The only other
    # job anywhere here that can write is wiki.yml's, and it writes to the wiki repository
    # rather than to this one.
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.preflight.outputs.version }}
      # What `gh` operates on, in place of a checkout: nothing in this job reads the tree, and a
      # checkout would be one more action running under the write scope for no reason.
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # `merge-multiple`, or each artifact arrives in a directory named after itself and every
      # path below gains a redundant level. No `name:` or `pattern:`, so this asks for whatever
      # the build produced -- which is the point: the assertion that follows is what says
      # whether that was the right set, and a pattern here would pre-filter the evidence.
      - name: Download what the build produced
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # The check that makes the release atomic on the way in. `needs: build` already covers a
      # leg that went red; what it does not cover is a leg that went *green while publishing
      # nothing* -- `Upload` is `if: matrix.publish`, and a leg that lost that key would skip
      # the upload and still succeed. `if-no-files-found: error` catches an empty upload, not an
      # absent one, and download-artifact matching nothing is not an error either: it is an
      # empty directory. So the set is named here and diffed, in the shape build.yml already
      # uses on the payload.
      #
      # Only the set, not the contents: every archive had its own file list diffed twice inside
      # the build, and the .pkg was installed there and its receipt diffed as well, so re-opening
      # any of them here would be the duplication this split exists to avoid.
      - name: Assert the release is complete before creating anything
        run: |
          # Spelled out rather than looped over the legs, which is what it was while every leg
          # contributed one file of one shape. The macOS leg contributes two -- its tarball and
          # the installer .pkg built from that tarball's payload -- so a loop would have to carry
          # an exception for one leg, and the file naming the set is the wrong place to hide one.
          # These are *file* names, not artifact names: the .pkg arrives in an artifact called
          # `…-macos-arm64-installer` and merge-multiple lays its one file out flat here.
          expected=$(mktemp)
          {
            for leg in linux-x86_64 linux-arm64 linux-armv7 macos-arm64; do
              echo "sendspin-cli-$VERSION-$leg.tar.gz"
            done
            echo "sendspin-cli-$VERSION-macos-arm64.pkg"
          } | sort >"$expected"

          actual=$(mktemp)
          (cd dist && find . ! -type d | sed 's|^\./||') | sort >"$actual"

          echo 'What the build handed over:'
          cat "$actual"
          diff -u "$expected" "$actual" || {
            echo "::error::what was downloaded is not the set $TAG is supposed to publish"
            exit 1
          }

      # Bare filenames, which is why this runs from inside dist/: `sha256sum -c` resolves the
      # paths it reads relative to the working directory, so a checksum file naming `dist/...`
      # is one a downloader cannot use without knowing that.
      - name: Checksum what is being published
        run: |
          cd dist
          # `--` rather than a `./` prefix, so the names stay bare without a substitution to
          # undo it afterwards.
          #
          # The .pkg is covered as well as the tarballs: a release asset a downloader has no way
          # to verify is worse than one that is not there. Globbed rather than named, and that is
          # safe here rather than fail-open -- with no `nullglob` an unmatched `*.pkg` reaches
          # sha256sum as a literal and errors under `-e`, and the assertion above has already
          # proven every file in the set is present.
          sha256sum -- *.tar.gz *.pkg >SHA256SUMS
          cat SHA256SUMS

      - name: Write the release notes
        run: |
          # Heredoc quoted, so the only interpolation is the one done explicitly below: this
          # text is full of backticks and $ that belong to the reader, not to the shell.
          cat >notes.md <<'NOTES'
          Binaries for Linux (x86-64, arm64 and 32-bit ARM) and macOS (Apple silicon), plus a
          macOS installer `.pkg`, built and published by `.github/workflows/release.yml` from
          the tag alone.

          `linux-armv7` is the 32-bit Raspberry Pi build — a Pi 2, a Pi 3, a Pi 4 or a Pi
          Zero 2 running a 32-bit Raspberry Pi OS. It is cross-compiled, and its unit suite and
          smoke test are run under emulation rather than on a Pi. A Pi Zero, a Pi Zero W and an
          original Pi are ARMv6 and this archive is not for them; see the roadmap below.

          ## Install

          Each archive is a staged `cmake --install` payload, so every path under its `usr/` is
          the path the file installs to:

          ```bash
          sudo tar -xzf sendspin-cli-@VERSION@-linux-x86_64.tar.gz --strip-components=1 -C / \
            sendspin-cli-@VERSION@-linux-x86_64/usr
          sudo systemd-sysusers
          sudo systemctl daemon-reload
          ```

          `systemd-sysusers` creates the unprivileged account the unit runs as, from the
          declaration the payload installs alongside it; a tarball has no `postinst` to run it
          for you, and without it `systemctl start` reports `217/USER`.

          Naming the `usr` member is what leaves `BUILD-INFO.txt` in the archive rather than
          unpacking it at `/`. Each archive carries its own `BUILD-INFO.txt` at the root with
          that command already filled in for its platform, the runtime packages it needs, and
          what the systemd unit does. Or run it where you unpacked it, at
          `./<name>/usr/local/bin/sendspin-cli`.

          On macOS the `.pkg` is the shorter path to the same place. It is built from the very
          payload the macOS archive holds, so the two put identical files on disk:

          ```bash
          sudo installer -pkg sendspin-cli-@VERSION@-macos-arm64.pkg -target /
          sendspin-cli --version
          ```

          There is no uninstaller: remove those files and run
          `sudo pkgutil --forget io.github.chrisuthe.sendspin-cli`.

          ## macOS is unsigned, archive and `.pkg` alike

          The macOS binary is **ad-hoc signed** — the minimum an arm64 Mach-O needs to execute
          at all, applied by the linker. It carries no developer identity, `spctl` rejects it,
          and the `.pkg` around it is unsigned in the same way. Unpack the archive from a
          terminal rather than in Finder, whose Archive Utility sets the quarantine flag where
          `tar` does not; if macOS refuses the binary anyway:

          ```bash
          xattr -d com.apple.quarantine \
            ./sendspin-cli-@VERSION@-macos-arm64/usr/local/bin/sendspin-cli
          ```

          A `.pkg` downloaded from this page is quarantined too, and Gatekeeper refuses it on a
          double-click — allow it once under **System Settings → Privacy & Security**, or use the
          `installer` command above, which makes no Gatekeeper assessment at all whatever the
          file is flagged with.

          All of that is a workaround, not a fix, and the `.pkg` is not the fix either. What it
          changes is narrower: `xcrun stapler` staples a notarization ticket to a `.pkg` and
          refuses a bare executable, so this is the shape that makes notarization possible at
          all. A Developer ID signature and notarization need a paid Apple enrolment and are
          still owed. Said plainly here because it is worth knowing before you download: these
          are unsigned builds from a public CI runner. The full account is under **macOS, and
          Gatekeeper** in the README linked below.

          ## Checksums

          `SHA256SUMS` covers the five files above. It does not cover the `Source code`
          archives GitHub attaches on its own, which are generated by GitHub rather than built
          here.

          ```bash
          sha256sum --ignore-missing -c SHA256SUMS      # Linux
          shasum -a 256 --ignore-missing -c SHA256SUMS  # macOS
          ```

          Run that from the directory you downloaded into. `--ignore-missing` is there because
          `SHA256SUMS` lists all five and you have almost certainly taken one: without it, the
          ones you did not download are reported as failures and the command exits non-zero on a
          perfectly good file.

          ## What this build is

          sendspin-cli @VERSION@. The version of the sendspin-cpp library it is linked against
          is pinned at build time and printed on the second line of `sendspin-cli --version`,
          alongside this one on the first.

          - [README](https://github.com/@REPO@/blob/@TAG@/README.md) — build, install, run,
            [macOS, and Gatekeeper](https://github.com/@REPO@/blob/@TAG@/README.md#macos-and-gatekeeper),
            and [the installer `.pkg`](https://github.com/@REPO@/blob/@TAG@/README.md#the-macos-installer-pkg)
          - [Roadmap](https://github.com/@REPO@/blob/@TAG@/docs/ROADMAP.md) — what shipped and
            what is owed, item by item
          NOTES

          # One quoted heredoc and one substitution pass, rather than a second unquoted heredoc
          # for the parts that need a value: nothing in this text is then subject to shell
          # expansion, so a backtick added to it later cannot become a command substitution in a
          # published release body. `|` as the delimiter because the repository name holds a `/`,
          # and every value substituted here is one the preflight already matched against a
          # pattern with no delimiter in it.
          #
          # The README and roadmap links are pinned to the tag: a relative link in a release body
          # resolves against the default branch, where the text it points at is free to move
          # after the release is cut.
          sed -i -e "s|@VERSION@|$VERSION|g" -e "s|@REPO@|$GH_REPO|g" -e "s|@TAG@|$TAG|g" notes.md
          echo '--- notes.md ---'
          cat notes.md

      # Created as a draft and published only once its assets are confirmed, which is what makes
      # the release atomic on the way out. `gh release create` does draft-upload-publish
      # internally already, so this is not the only thing standing between a failed upload and a
      # published release -- it is the only *pinned* thing. `gh` is the one tool here that cannot
      # be pinned to a version, so its internal sequencing is not pinned either, and this job
      # exists to guarantee exactly the property that sequencing provides. Splitting it moves the
      # guarantee into this file, versioned with everything else.
      #
      # Which draft, though, is a question the tag cannot answer, and that is what the release id
      # captured below is for. A draft is not bound to a tag ref: `gh release create` does not
      # refuse a tag something already holds, it adds another draft beside it, so one tag can
      # name several releases at once. The preflight guard stops the case that matters, and this
      # step still pins its own result rather than trusting the tag to be unambiguous by then.
      #
      # So a draft left behind by a failed run no longer blocks anything here -- it is litter,
      # not an obstacle, and the run that follows ignores it rather than overwriting or
      # republishing it. Clean it up anyway, and when re-running, re-run the *failed jobs*:
      # re-running all of them repeats the build, and upload-artifact refuses an artifact name
      # the run already has.
      #
      # --verify-tag is what turns "this workflow never creates tags" into a gate: without it,
      # gh creates a missing tag from the default branch rather than refusing.
      - name: Create the release as a draft
        id: draft
        run: |
          # Printed because it is the one tool version this workflow cannot pin: the runner
          # provides it, so the log is the only place a future behaviour change is diagnosable.
          gh --version
          echo "Publishing $TAG (version $VERSION) with:"
          ls -l dist

          # stdout is the release's URL and nothing else, so it is the one handle this step gets
          # on what it just made. `tee` because the log should still show it.
          gh release create "$TAG" \
            --verify-tag \
            --title "sendspin-cli $VERSION" \
            --notes-file notes.md \
            --draft \
            dist/*.tar.gz dist/*.pkg dist/SHA256SUMS | tee created.txt

          # That URL ends in an `untagged-<hash>` slug, unique to this draft, and `gh release
          # view` does resolve one. Undocumented, though -- `gh release view [<tag>]` promises a
          # tag -- and this job's whole shape is a bet against unpinned `gh` behaviour, so the
          # slug is traded for the numeric id here, once, and every step after this talks to the
          # documented REST endpoints for a release by id.
          #
          # Matched on html_url rather than on the slug, because the URL is what `create`
          # actually hands over; parsing a slug out of it would be one assumption about its
          # shape for no gain. A release's html_url is unique, so this yields exactly one id --
          # asserted rather than assumed, since an empty match under `set -e` is a *successful*
          # jq run producing nothing, and the failure would otherwise land two steps later
          # wearing a confusing message.
          url="$(tail -n1 created.txt)"
          release_id="$(RELEASE_URL="$url" gh api "repos/$GH_REPO/releases" --paginate \
            --jq '.[] | select(.html_url == env.RELEASE_URL) | .id')"
          case "$release_id" in
            ''|*[!0-9]*)
              echo "::error::could not resolve a single release id for $url; got: $release_id"
              exit 1
              ;;
          esac

          echo "draft $url is release id $release_id"
          echo "release_id=$release_id" >>"$GITHUB_OUTPUT"

      - name: Assert every asset arrived, then publish
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          expected=$(mktemp)
          {
            echo SHA256SUMS
            for leg in linux-x86_64 linux-arm64 linux-armv7 macos-arm64; do
              echo "sendspin-cli-$VERSION-$leg.tar.gz"
            done
            echo "sendspin-cli-$VERSION-macos-arm64.pkg"
          } | sort >"$expected"

          # Read back from the API rather than from what was uploaded, so this reports what the
          # release actually holds -- which is how an asset GitHub accepted under a name it
          # sanitized gets caught, that being a successful upload and a release SHA256SUMS no
          # longer describes.
          #
          # By id, and this is the fix: what stood here read `gh release view "$TAG"`, and
          # `releases/tags/<tag>` resolves a tag to a *published* release. Drafts are never in
          # that answer, so the step read some other release for this tag -- on v0.1.1 and
          # v0.1.3, an asset-less one -- diffed five expected names against nothing, and failed
          # every release since v0.1.0 while the draft it should have been looking at sat there
          # complete. The id from the create step names that draft and only that draft.
          actual=$(mktemp)
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.assets[].name' | sort >"$actual"

          echo 'What the draft release holds:'
          cat "$actual"
          diff -u "$expected" "$actual" || {
            echo "::error::draft release $RELEASE_ID for $TAG is missing assets and will not be published; delete it and re-run the failed jobs"
            exit 1
          }

          # -F, not -f: draft is a boolean to the API, and -f would send the string "false",
          # which is truthy and would leave the release a draft while reporting success.
          gh api -X PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false --silent
          echo "Published: $(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq .html_url)"
